<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | 3B TECH HUB</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px 110px; display: grid; place-items: center; background: #f3f4f6; color: #111827; font-family: system-ui, sans-serif; }
    .card { width: min(100%, 420px); padding: 32px; background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; box-shadow: 0 12px 36px rgb(17 24 39 / 8%); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 26px; color: #6b7280; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #d1d5db; border-radius: 10px; font: inherit; outline: none; }
    input:focus { border-color: #111827; box-shadow: 0 0 0 3px rgb(17 24 39 / 10%); }
    button { width: 100%; margin-top: 24px; padding: 13px 18px; border: 0; border-radius: 10px; background: #111827; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 22px; margin-top: 14px; color: #b91c1c; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your 3B TECH HUB account</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
      <button id="login-button" type="submit">Login</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      "https://sburxeuxkrilbfppxylm.supabase.co",
      "sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT"
    );

    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      button.disabled = true;
      button.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        status.textContent = error.message;
        button.disabled = false;
        button.textContent = "Login";
        return;
      }

      window.location.replace("./account.html");
    });
  </script>
  <script src="./navigation.js"></script>
</body>
</html>
