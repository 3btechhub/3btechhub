<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../global.css">
<script src="../navigation.js" defer></script>
<title>3B TECH HUB</title>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.1";
const supabase=createClient("https://sburxeuxkrilbfppxylm.supabase.co","sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT");
const root=document.getElementById("home-types");
const status=document.getElementById("home-status");
const showError=message=>{status.textContent=message};
async function renderHome(){
 const [{data:sections,error:sectionError},{data:items,error:itemError}]=await Promise.all([
  supabase.from("homepage_type_settings").select("content_type,sort_order").eq("is_enabled",true).order("sort_order"),
  supabase.from("content").select("id,type,name").order("created_at",{ascending:false})
 ]);
 if(sectionError||itemError){showError((sectionError||itemError).message||"Unable to load Home Page.");return}
 root.replaceChildren();
 (sections||[]).forEach(section=>{
  const card=document.createElement("section");card.className="home__type";
  const heading=document.createElement("h2");heading.textContent=section.content_type;
  const list=document.createElement("div");list.className="home__items";
  const matching=(items||[]).filter(item=>item.type===section.content_type);
  if(!matching.length)return;
  matching.forEach(item=>{const itemCard=document.createElement("article");itemCard.className="home__item";itemCard.textContent=item.name;list.append(itemCard)});
  card.append(heading,list);root.append(card);
 });
}
renderHome();
</script>
</head>
<body>
<main class="container home">
<div class="home__types" id="home-types"></div>
<p class="home__status" id="home-status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
