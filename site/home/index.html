<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../global.css">
<script src="../navigation.js" defer></script>
<title>3B TECH HUB</title>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.1";
import {connectGlobalRealtime} from "../realtime.js";
import {initSiteIcons} from "../icons.js";
const supabase=createClient("https://sburxeuxkrilbfppxylm.supabase.co","sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT");
const root=document.getElementById("home-types"),status=document.getElementById("home-status");
const HOME_ITEM_LIMIT=4;connectGlobalRealtime(supabase);initSiteIcons(supabase);
let renderVersion=0;
const publicImageUrl=path=>!path?"":/^https?:\/\//i.test(path)?path:supabase.storage.from("site-media").getPublicUrl(path).data.publicUrl;
const safeMapUrl=value=>{try{const url=new URL(value);return url.protocol==="https:"&&["maps.app.goo.gl","google.com","www.google.com","maps.google.com","maps.apple.com"].includes(url.hostname)?url.href:""}catch{return ""}};
const iconFor={Services:"module.services",Products:"module.products",Technician:"module.technician",Workshop:"module.workshop",Gallery:"module.gallery",Contacts:"module.contacts",Location:"field.location",Images:"module.images",Videos:"module.videos"};
function makeItem(item){
 const card=document.createElement("a");card.className="home__item";card.href="../content/?module="+encodeURIComponent(item.module)+"&id="+encodeURIComponent(item.id);
 if(item.module==="Images"&&item.image_url){card.classList.add("home__item--image");const img=document.createElement("img");img.className="home__image";img.src=publicImageUrl(item.image_url);img.alt=item.name||"";img.loading="lazy";img.decoding="async";const caption=document.createElement("p");caption.className="home__image-caption";caption.textContent=item.name||"";card.append(img,caption);return card}
 const title=document.createElement("h3");title.className="home__item-title";title.textContent=item.name||"";
 const icon=document.createElement("span");icon.dataset.siteIcon=iconFor[item.module]||"";icon.setAttribute("aria-hidden","true");card.append(title);if(icon.dataset.siteIcon)card.append(icon);
 if(["Workshop","Location"].includes(item.module)&&item.location){const p=document.createElement("p");p.className="home__location";const pin=document.createElement("span");pin.dataset.siteIcon="field.location";pin.setAttribute("aria-hidden","true");const txt=document.createElement("span");txt.textContent=item.location;p.append(pin,txt);card.append(p)}
 const map=safeMapUrl(item.map);if(map){const a=document.createElement("a");a.className="home__map-link";a.href=map;a.target="_blank";a.rel="noopener noreferrer";a.textContent="View Location";card.append(a)}
 return card;
}
async function renderHome(){
 const version=++renderVersion;
 const [{data:settings,error:settingsError},{data:items,error:itemError},{data:prefs,error:prefsError}]=await Promise.all([
  supabase.from("homepage_module_settings").select("module,sort_order").eq("is_enabled",true).order("sort_order"),
  supabase.from("content").select("id,module,name,image_url,location,map").order("created_at",{ascending:false}),
  supabase.from("site_preferences").select("preference_key,preference_value").in("preference_key",["website_title","intro","website_logo"])
 ]);
 if(version!==renderVersion)return;
 if(settingsError||itemError||prefsError){status.textContent=(settingsError||itemError||prefsError).message||"Unable to load Home Page.";return}
 const values=Object.fromEntries((prefs||[]).map(x=>[x.preference_key,x.preference_value]));
 document.title=(values.website_title||"3B TECH HUB")+" · 3B TECH HUB";
 const intro=document.getElementById("home-intro");intro.textContent=values.intro||"";intro.hidden=!values.intro;
 const logo=document.getElementById("home-logo");if(values.website_logo){logo.src=publicImageUrl(values.website_logo);logo.hidden=false}else{logo.hidden=true}
 const title=document.getElementById("home-title");title.textContent=values.website_title||"";
 title.hidden=!values.website_title;
 root.replaceChildren();
 (settings||[]).forEach(section=>{
  const matching=(items||[]).filter(item=>item.module===section.module);if(!matching.length)return;
  const sectionEl=document.createElement("section");sectionEl.className="home__type";
  const heading=document.createElement("h2"),link=document.createElement("a");link.className="home__type-link";link.href="../content/?module="+encodeURIComponent(section.module);link.textContent=section.module;
  const icon=document.createElement("span");icon.dataset.siteIcon=iconFor[section.module]||"";icon.setAttribute("aria-hidden","true");heading.append(link);if(icon.dataset.siteIcon)heading.append(icon);
  const list=document.createElement("div");list.className="home__items";if(section.module==="Images"||section.module==="Gallery")list.classList.add("home__items--gallery");
  if(matching.length>HOME_ITEM_LIMIT){matching.slice(0,HOME_ITEM_LIMIT-1).forEach(item=>list.append(makeItem(item)));const all=document.createElement("a");all.className="home__item home__view-all-card";all.href="../content/?module="+encodeURIComponent(section.module);all.textContent="View All";list.append(all)}
  else matching.forEach(item=>list.append(makeItem(item)));
  sectionEl.append(heading,list);root.append(sectionEl);
 });
 window.siteIcons?.apply();
}
renderHome();window.addEventListener("3b:global-update",renderHome);
</script>
</head>
<body>
<main class="container home">
<header class="home__intro-block">
<img id="home-logo" class="home__logo" alt="Website logo" hidden>
<h1 id="home-title" hidden></h1>
<p id="home-intro" class="home__intro" hidden></p>
</header>
<div class="home__types" id="home-types"></div>
<p class="home__status" id="home-status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
