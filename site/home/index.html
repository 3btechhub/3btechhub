<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: var(--page-background, Canvas); }
    .skeleton-screen { position: fixed; inset: 0; z-index: 2000; background: var(--page-background, Canvas); }
  </style>
  <link rel="stylesheet" href="../theme/classic.css" data-site-theme media="print" onload="this.media='all'">
  <script src="../component/theme.js" defer></script>
  <script src="../component/webpage-title.js" defer></script>
  <script src="../component/navigation.js" defer></script>
</head>
<body>
  <div class="skeleton-screen" aria-hidden="true"></div>
  <site-theme src="../theme/classic.css"></site-theme>
  <main class="page-content" id="page-content" hidden>
    <webpage-title>Home</webpage-title>
    <site-navigation></site-navigation>
  </main>
  <script>
    const redirectToOverview = () => {
      window.location.replace(new URL('overview/', window.location.href).href);
    };
    if (document.documentElement.classList.contains('page-ready')) {
      redirectToOverview();
    } else {
      document.addEventListener('page-ready', redirectToOverview, { once: true });
    }
  </script>
</body>
</html>
