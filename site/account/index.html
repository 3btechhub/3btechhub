<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="../global.css">
<link rel="stylesheet" href="../navigation.css">
<script src="../navigation.js" defer></script>
<title>Account</title>
<style>
  body { visibility: hidden; }
  html.account-ready body { visibility: visible; }
  .account-layout {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--page-gutter);
  }
  .account-panel {
    display: grid;
    gap: var(--space-3);
    width: min(100%, 360px);
  }
  .account-panel[hidden] { display: none; }
  .account-panel .button { width: 100%; }
  .profile-email {
    overflow-wrap: anywhere;
    text-align: center;
  }
</style>
</head>
<body>
<main class="account-layout">
  <form class="account-panel" id="login-form" hidden>
    <input id="email" name="email" type="email" placeholder="Email" aria-label="Email" autocomplete="username" inputmode="email" required>
    <input id="password" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    <button class="button button--primary" id="login-button" type="submit">Login</button>
  </form>

  <section class="account-panel" id="profile-panel" hidden>
    <p class="profile-email" id="profile-email"></p>
    <button class="button button--primary" id="logout-button" type="button">Logout</button>
  </section>
</main>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.119.1";

  const supabase = createClient(
    "https://sburxeuxkrilbfppxylm.supabase.co",
    "sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT"
  );

  const form = document.getElementById("login-form");
  const loginButton = document.getElementById("login-button");
  const profilePanel = document.getElementById("profile-panel");
  const profileEmail = document.getElementById("profile-email");
  const logoutButton = document.getElementById("logout-button");

  function showAccount(session) {
    const userEmail = session?.user?.email || "";
    form.hidden = Boolean(session);
    profilePanel.hidden = !session;
    profileEmail.textContent = userEmail;
    document.documentElement.classList.add("account-ready");
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!form.reportValidity()) return;

    loginButton.disabled = true;
    try {
      const { error } = await supabase.auth.signInWithPassword({
        email: form.elements.email.value.trim(),
        password: form.elements.password.value
      });

      if (error) throw error;
      window.location.assign(new URL("../dashboard/", window.location.href).href);
    } catch (error) {
      alert(error?.message || "Login failed. Please try again.");
    } finally {
      loginButton.disabled = false;
    }
  });

  logoutButton.addEventListener("click", async () => {
    logoutButton.disabled = true;
    try {
      const { error } = await supabase.auth.signOut();
      if (error) throw error;
      showAccount(null);
    } catch (error) {
      alert(error?.message || "Logout failed. Please try again.");
    } finally {
      logoutButton.disabled = false;
    }
  });

  const { data: { session }, error } = await supabase.auth.getSession();
  showAccount(error ? null : session);

  supabase.auth.onAuthStateChange((_event, nextSession) => {
    showAccount(nextSession);
  });
</script>
</body>
</html>
