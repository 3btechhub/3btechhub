<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
html,body{margin:0;min-height:100%;background:var(--page-background,Canvas)}
.skeleton-screen{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;gap:24px;padding:24px;overflow:hidden;background:var(--page-background,Canvas)}
.skeleton-line,.skeleton-block,.skeleton-circle{position:relative;overflow:hidden;background:var(--skeleton-surface,color-mix(in srgb, CanvasText 9%, Canvas))}
.skeleton-line:after,.skeleton-block:after,.skeleton-circle:after{position:absolute;inset:0;content:"";transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--skeleton-shimmer,color-mix(in srgb, Canvas 80%, transparent)),transparent);animation:skeleton-shimmer 1.35s infinite}
.skeleton-line{height:14px;border-radius:var(--effect-radius-small,8px)}
.skeleton-circle{width:48px;height:48px;flex:none;border-radius:50%}
.skeleton-block{height:92px;border-radius:var(--effect-radius-small,12px)}
.skeleton-heading{width:46%;height:24px;margin:8px auto 20px}
.skeleton-short{width:34%}.skeleton-medium{width:62%}.skeleton-wide{width:100%}
.skeleton-row{display:flex;align-items:center;gap:14px}
.skeleton-stack{display:flex;flex-direction:column;gap:14px}
@keyframes skeleton-shimmer{100%{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.skeleton-line:after,.skeleton-block:after,.skeleton-circle:after{animation:none}}
</style>
<title>Login</title>
  <link rel="stylesheet" href="../../theme/classic.css" data-site-theme>
  <script src="../../component/theme.js" defer></script>
  <script src="../../component/webpage-title.js" defer></script>
  <script src="../../component/navigation.js" defer></script>
  <script type="module" src="../../component/account-auth.js?v=20261122-2"></script>

</head>
<body>
  <div class="skeleton-screen" aria-hidden="true">
  <div class="skeleton-line skeleton-heading"></div>
  <div class="skeleton-row"><div class="skeleton-circle"></div><div class="skeleton-stack"><div class="skeleton-line skeleton-medium"></div><div class="skeleton-line skeleton-short"></div></div></div>
  <div class="skeleton-stack"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
</div>

  <site-theme src="../../theme/classic.css"></site-theme>

  <main class="page-content" id="page-content" data-auth-check-required="true" hidden>
    <webpage-title>Login</webpage-title>
    <site-navigation></site-navigation>

    <section class="account-auth">
      <h2>Login</h2>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>

        <button id="login-button" type="submit">Login</button>
        <p id="login-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
