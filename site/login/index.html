<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="../theme/classic.css">
  <script src="../component/webpage-title.js" defer></script>
  <script src="../component/navigation.js" defer></script>
  <script type="module" src="../component/account-auth.js?v=20261122-3"></script>
</head>
<body>
  <main class="page-content" id="page-content">
    <webpage-title>Login</webpage-title>
    <site-navigation></site-navigation>
    <section class="account-auth">
      <h2>Login</h2>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">Login</button>
        <p id="login-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
