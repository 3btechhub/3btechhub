<!doctype html>
<html lang="en" class="dashboard-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../global.css">
<script src="../navigation.js" defer></script>
<title>Dashboard · 3B TECH HUB</title>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.1";
import {connectGlobalRealtime} from "../realtime.js";
import {initSiteIcons} from "../icons.js";
const supabase=createClient("https://sburxeuxkrilbfppxylm.supabase.co","sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT");
const OWNER_ID="0074818e-942d-4752-ada2-01a11e291ff4";
const accountUrl=new URL("../account/",location.href);accountUrl.searchParams.set("returnTo",location.href);
const {data:{session},error:authError}=await supabase.auth.getSession();
if(authError||!session)location.replace(accountUrl.href);
else if(session.user.id!==OWNER_ID){const denied=new URL("../account/",location.href);denied.searchParams.set("access","denied");location.replace(denied.href)}
else{document.documentElement.classList.add("authenticated");start()}
function start(){
 connectGlobalRealtime(supabase);initSiteIcons(supabase);
 const $=id=>document.getElementById(id);
 const groups={
  Content:["Services","Products","Technician","Workshop","Gallery"],
  Information:["Contacts","Location"],
  Media:["Images","Videos"],
  Administration:["User","Role","Permission"],
  Customization:["Theme","Icon"],
  Preference:["Region","Direction","Language"],
  Settings:["Website Logo","Website Title","Intro","Homepage Management","Details Management"]
 };
 const fields={
  Services:[["slug","Slug"]],Products:[["slug","Slug"]],Technician:[["slug","Slug"],["skills","Skills"]],
  Workshop:[["slug","Slug"],["location","Location"],["map","Map URL"]],
  Gallery:[["slug","Slug"]],Contacts:[["label","Label"],["value","Value"]],
  Location:[["location","Location"],["map","Map URL"]],
  Images:[["image_url","Image URL"]],Videos:[["image_url","Image URL"],["file_title","File Title"]]
 };
 const icons={Services:"module.services",Products:"module.products",Technician:"module.technician",Workshop:"module.workshop",Gallery:"module.gallery",Contacts:"module.contacts",Location:"field.location",Images:"module.images",Videos:"module.videos"};
 const state={category:"Content",module:"Services",items:[],roles:[],selected:null,related:new Set(),busy:false};
 const status=$("dashboard-status");
 const say=(message,error=false)=>{status.textContent=message||"";status.dataset.state=error?"error":message?"success":"info"};
 const node=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
 const button=(label,cls,handler)=>{const b=node("button",cls,label);b.type="button";b.addEventListener("click",handler);return b};
 const safeSlug=value=>String(value||"").trim().toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
 const publicUrl=path=>!path?"":/^https?:\/\//i.test(path)?path:supabase.storage.from("site-media").getPublicUrl(path).data.publicUrl;
 function renderNavigation(){
  $("dashboard-categories").replaceChildren();
  Object.keys(groups).forEach(category=>{
   const b=button(category,"dashboard-category"+(state.category===category?" is-active":""),()=>{state.category=category;state.module=groups[category][0];state.selected=null;renderNavigation();renderModule()});
   b.setAttribute("aria-pressed",String(state.category===category));$("dashboard-categories").append(b);
  });
  $("dashboard-modules").replaceChildren();
  groups[state.category].forEach(module=>{
   const b=button(module,"dashboard-module"+(state.module===module?" is-active":""),()=>{state.module=module;state.selected=null;renderNavigation();renderModule()});
   b.setAttribute("aria-pressed",String(state.module===module));$("dashboard-modules").append(b);
  });
 }
 function field(form,label,key,value="",type="text",required=false){
  const wrap=node("div","dashboard__field");
  const input=node("input");input.type=type;input.name=key;input.placeholder=label;input.setAttribute("aria-label",label);input.value=value||"";input.required=required;input.autocomplete="off";
  wrap.append(input);form.append(wrap);return input;
 }
 function actionRow(form,includeDelete=true){
  const row=node("div","dashboard__actions");
  const save=button("Save","button button--primary",()=>{});save.type="submit";
  const cancel=button("Cancel","button button--secondary",()=>{state.selected=null;renderModule()});
  row.append(save,cancel);
  if(includeDelete){const del=button("Delete","button button--secondary",deleteSelected);del.disabled=!state.selected;row.append(del)}
  return row;
 }
 async function loadRoles(){
  const {data,error}=await supabase.from("roles").select("name").order("name");if(error)throw error;state.roles=data||[];
 }
 async function loadContent(){
  const {data,error}=await supabase.from("content").select("id,module,name,slug,skills,label,value,image_url,file_title,location,map,created_at").eq("module",state.module).order("created_at",{ascending:false});
  if(error)throw error;state.items=data||[];
 }
 function renderItemList(root){
  root.replaceChildren();
  if(!state.items.length){root.append(node("p","dashboard__empty","No items yet"));return}
  state.items.forEach(item=>{
   const row=node("div","dashboard__item");
   const info=node("span","dashboard__item-info");
   info.append(node("strong","dashboard__item-name",item.name));
   const meta=(fields[state.module]||[]).map(([key,label])=>item[key]?label+": "+item[key]:"").filter(Boolean);
   if(item.slug)meta.push("Slug: "+item.slug);
   if(meta.length)info.append(node("small","dashboard__item-meta",meta.join(" · ")));
   row.append(info);
   if(item.image_url){const img=node("img","dashboard__item-thumb");img.src=publicUrl(item.image_url);img.alt="";img.loading="lazy";row.append(img)}
   row.append(button("Edit","button button--ghost",()=>{state.selected=item;renderModule()}));
   root.append(row);
  });
 }
 async function renderContentModule(panel){
  panel.replaceChildren();
  const heading=node("h2","",state.module);const create=button("Create","button button--primary",()=>{state.selected=null;renderModule(true)});
  const relation=button("Relations","button button--secondary",()=>openRelations());
  const list=node("div","dashboard__list");
  panel.append(heading,node("div","dashboard__actions"));panel.lastChild.append(create,relation);panel.append(list);
  await loadContent();renderItemList(list);
  if(state.selected)renderContentForm(panel,state.selected);
 }
 function renderContentForm(panel,item){
  const form=node("form","dashboard__manager-form");
  const title=node("h3","",item?"Edit "+state.module:"Create "+state.module);form.append(title);
  const name=field(form,"Name","name",item?.name||"","text",true);
  const moduleFields={};
  (fields[state.module]||[]).forEach(([key,label])=>{moduleFields[key]=field(form,label,key,item?.[key]||"",key==="map"||key==="image_url"?"url":"text",false)});
  let upload=null;
  if(["Images","Videos"].includes(state.module)){
   const wrap=node("div","dashboard__field");const label=node("label","","Upload");upload=node("input");upload.type="file";upload.accept=state.module==="Images"?"image/*":"video/*";label.append(upload);wrap.append(label);form.append(wrap);
  }
  if(state.module==="Videos")moduleFields.file_title.readOnly=true;
  if(upload&&state.module==="Videos")upload.addEventListener("change",()=>moduleFields.file_title.value=upload.files?.[0]?.name||"");
  const slugInput=moduleFields.slug;
  if(slugInput&&!item)name.addEventListener("input",()=>{if(!slugInput.dataset.edited)slugInput.value=safeSlug(name.value)});
  if(slugInput)slugInput.addEventListener("input",()=>slugInput.dataset.edited="true");
  const rolesWrap=node("div","dashboard__field");rolesWrap.append(node("label","","Visibility — Roles"));
  const roles=node("div","dashboard__role-options");
  state.roles.forEach(role=>{const label=node("label","dashboard__option");const cb=node("input");cb.type="checkbox";cb.value=role.name;cb.checked=role.name==="Owner";label.append(cb,node("span","",role.name));roles.append(label)});
  rolesWrap.append(roles);form.append(rolesWrap);
  const actions=actionRow(form);form.append(actions);
  if(item){const manage=button("Manage Relations","button button--secondary",()=>openRelations(item));actions.append(manage)}
  form.addEventListener("submit",async e=>{
   e.preventDefault();if(state.busy)return;
   const selectedRoles=[...roles.querySelectorAll("input:checked")].map(x=>x.value);
   if(!selectedRoles.length){say("Select at least one visibility role.",true);return}
   const payload={module:state.module,name:name.value.trim(),updated_at:new Date().toISOString()};
   Object.keys(moduleFields).forEach(key=>payload[key]=moduleFields[key].value.trim()||null);
   if(payload.slug&& !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(payload.slug)){say("Enter a valid slug.",true);return}
   if(upload?.files?.[0]){
    const file=upload.files[0],ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path=state.module.toLowerCase()+"/"+(payload.slug||safeSlug(name.value)||"upload")+"/"+crypto.randomUUID()+"."+ext;
    const {data,error}=await supabase.storage.from("site-media").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type||undefined});
    if(error){say(error.message,true);return}payload.image_url=data.path;
    if(state.module==="Videos")payload.file_title=file.name;
   }
   state.busy=true;
   try{
    let id=item?.id;
    if(item){const {error}=await supabase.from("content").update(payload).eq("id",id);if(error)throw error}
    else{const {data,error}=await supabase.from("content").insert(payload).select("id").single();if(error)throw error;id=data.id}
    const {error:clearError}=await supabase.from("content_visibility").delete().eq("content_id",id);if(clearError)throw clearError;
    const {error:visibilityError}=await supabase.from("content_visibility").insert(selectedRoles.map(role_name=>({content_id:id,role_name})));if(visibilityError)throw visibilityError;
    state.selected=null;say(item?"Updated":"Created");await renderModule();
   }catch(err){say(err.message,true)}finally{state.busy=false}
  });
  if(item){
   supabase.from("content_visibility").select("role_name").eq("content_id",item.id).then(({data,error})=>{
    if(error)return say(error.message,true);const selected=new Set((data||[]).map(x=>x.role_name));roles.querySelectorAll("input").forEach(x=>x.checked=selected.has(x.value));
   });
  }
  panel.append(form);
 }
 async function deleteSelected(){
  if(!state.selected||!confirm("Delete this item and its relations?"))return;
  const {error}=await supabase.from("content").delete().eq("id",state.selected.id);
  if(error){say(error.message,true);return}state.selected=null;say("Deleted");await renderModule();
 }
 async function openRelations(item=state.selected){
  if(!item){say("Select an item first.",true);return}
  const panel=$("dashboard-panel");panel.replaceChildren();
  panel.append(node("h2","","Relations · "+item.name));
  const {data:all,error:allError}=await supabase.from("content").select("id,module,name").neq("id",item.id).order("module").order("name");
  if(allError){say(allError.message,true);return}
  const {data:existing,error}=await supabase.from("relation").select("source_id,target_id").or("source_id.eq."+item.id+",target_id.eq."+item.id);
  if(error){say(error.message,true);return}
  const selected=new Set((existing||[]).map(r=>r.source_id===item.id?r.target_id:r.source_id));
  const groupsByModule={};(all||[]).forEach(x=>(groupsByModule[x.module]??=[]).push(x));
  const area=node("div","dashboard__relation-groups");
  Object.entries(groupsByModule).forEach(([module,items])=>{
   const group=node("section","dashboard__relation-group");group.append(node("h3","",module));
   items.forEach(x=>{const label=node("label","dashboard__option");const cb=node("input");cb.type="checkbox";cb.value=x.id;cb.checked=selected.has(x.id);label.append(cb,node("span","",x.name));group.append(label)});
   area.append(group);
  });
  const actions=node("div","dashboard__actions");
  actions.append(button("Save Relations","button button--primary",async()=>{
   const chosen=new Set([...area.querySelectorAll("input:checked")].map(x=>x.value));
   const old=new Map((existing||[]).map(r=>[r.source_id===item.id?r.target_id:r.source_id,r]));
   const remove=[...old].filter(([id])=>!chosen.has(id)).map(([,r])=>r);
   const add=[...chosen].filter(id=>!old.has(id)).map(id=>({source_id:item.id,target_id:id}));
   for(const r of remove){const {error}=await supabase.from("relation").delete().eq("source_id",r.source_id).eq("target_id",r.target_id);if(error){say(error.message,true);return}}
   if(add.length){const {error}=await supabase.from("relation").insert(add);if(error){say(error.message,true);return}}
   say("Relations saved");renderModule();
  }));
  actions.append(button("Cancel","button button--secondary",()=>renderModule()));
  panel.append(area,actions);
 }
 async function callUserAdmin(body){const {data,error}=await supabase.functions.invoke("owner-users",{body});if(error)throw error;return data}
 async function renderAdmin(panel){
  panel.replaceChildren(node("h2","",state.module));
  const form=node("form","dashboard__manager-form"),list=node("div","dashboard__list");
  const name=field(form,state.module+" name","name");
  let email=null,roleSelect=null,permArea=null;
  if(state.module==="User"){email=field(form,"Email","email","","email");roleSelect=node("select");roleSelect.setAttribute("aria-label","Role");form.append(roleSelect)}
  if(state.module==="Role"){permArea=node("div","dashboard__relation-options");form.append(node("p","","Permissions"),permArea)}
  const actions=node("div","dashboard__actions");const save=node("button","button button--primary","Save");save.type="submit";actions.append(save);form.append(actions);
  const create=button("Create","button button--secondary",()=>{form.hidden=false;form.reset();form.dataset.id="";form.dataset.edit="";if(name)name.disabled=false});
  panel.append(create,form,list);form.hidden=true;
  async function load(){
   list.replaceChildren();
   if(state.module==="User"){
    const [{data:roles,error:rErr},users]=await Promise.all([supabase.from("roles").select("name").order("name"),callUserAdmin({action:"list",page:1,perPage:100})]);if(rErr)throw rErr;
    roleSelect.replaceChildren();(roles||[]).forEach(r=>{const o=node("option","",r.name);o.value=r.name;roleSelect.append(o)});
    (users.users||[]).forEach(u=>{const row=node("div","dashboard__item", (u.name||u.email)+" · "+u.role);if(!u.protected)row.append(button("Edit","button button--ghost",()=>{form.hidden=false;form.dataset.id=u.id;form.dataset.edit="true";name.value=u.name||"";email.value=u.email;email.disabled=true;roleSelect.value=u.role}));list.append(row)});
   }else if(state.module==="Role"){
    const [{data:rows,error},{data:perms,error:pErr}]=await Promise.all([supabase.from("roles").select("name,is_permanent").order("name"),supabase.from("permissions").select("name").order("name")]);if(error)throw error;if(pErr)throw pErr;
    permArea.replaceChildren();(perms||[]).forEach(p=>{const label=node("label","dashboard__option");const cb=node("input");cb.type="checkbox";cb.value=p.name;label.append(cb,node("span","",p.name));permArea.append(label)});
    (rows||[]).forEach(r=>{const row=node("div","dashboard__item",r.name+(r.is_permanent?" · Permanent":""));row.append(button("Edit","button button--ghost",async()=>{form.hidden=false;form.dataset.id=r.name;form.dataset.edit="true";name.value=r.name;name.disabled=!!r.is_permanent;const {data}=await supabase.from("role_permissions").select("permission_name").eq("role_name",r.name);const selected=new Set((data||[]).map(x=>x.permission_name));permArea.querySelectorAll("input").forEach(x=>x.checked=selected.has(x.value))}));list.append(row)});
   }else{
    const {data,error}=await supabase.from("permissions").select("name,is_permanent").order("name");if(error)throw error;
    (data||[]).forEach(r=>{const row=node("div","dashboard__item",r.name+(r.is_permanent?" · Permanent":""));if(!r.is_permanent)row.append(button("Edit","button button--ghost",()=>{form.hidden=false;form.dataset.id=r.name;form.dataset.edit="true";name.value=r.name}));list.append(row)});
   }
  }
  form.addEventListener("submit",async e=>{
   e.preventDefault();try{
    if(state.module==="User"){
     if(form.dataset.edit==="true"){await callUserAdmin({action:"update",userId:form.dataset.id,name:name.value.trim()});await callUserAdmin({action:"set-role",userId:form.dataset.id,role:roleSelect.value})}
     else await callUserAdmin({action:"invite",email:email.value.trim(),name:name.value.trim(),role:roleSelect.value});
    }else if(state.module==="Role"){
     let role=form.dataset.id;if(form.dataset.edit!=="true"){role=name.value.trim();const {error}=await supabase.from("roles").insert({name:role});if(error)throw error}
     const {error:clearError}=await supabase.from("role_permissions").delete().eq("role_name",role);if(clearError)throw clearError;
     const selected=[...permArea.querySelectorAll("input:checked")].map(x=>x.value);if(selected.length){const {error}=await supabase.from("role_permissions").insert(selected.map(permission_name=>({role_name:role,permission_name})));if(error)throw error}
    }else{
     const result=form.dataset.edit==="true"?await supabase.from("permissions").update({name:name.value.trim()}).eq("name",form.dataset.id):await supabase.from("permissions").insert({name:name.value.trim()});if(result.error)throw result.error;
    }
    form.hidden=true;form.reset();form.dataset.id="";form.dataset.edit="";name.disabled=false;if(email)email.disabled=false;say("Saved");await load();
   }catch(err){say(err.message,true)}
  });
  await load();
 }
 async function renderConfig(panel){
  panel.replaceChildren(node("h2","",state.module));
  const table="configuration_items",list=node("div","dashboard__list"),form=node("form","dashboard__manager-form");
  const name=field(form,state.module+" name","name");
  const actions=node("div","dashboard__actions");const save=node("button","button button--primary","Save");save.type="submit";actions.append(save);form.append(actions);
  const create=button("Create","button button--secondary",()=>{form.hidden=false;form.reset();form.dataset.id=""});
  panel.append(create,form,list);form.hidden=true;
  const load=async()=>{const {data,error}=await supabase.from(table).select("id,name,is_permanent").eq("category",state.module).order("name");if(error)throw error;list.replaceChildren();(data||[]).forEach(x=>{const row=node("div","dashboard__item",x.name+(x.is_permanent?" · Permanent":""));if(!x.is_permanent)row.append(button("Edit","button button--ghost",()=>{form.hidden=false;form.dataset.id=x.id;name.value=x.name}));list.append(row)})};
  form.addEventListener("submit",async e=>{e.preventDefault();const result=form.dataset.id?await supabase.from(table).update({name:name.value.trim()}).eq("id",form.dataset.id):await supabase.from(table).insert({category:state.module,name:name.value.trim()});if(result.error)say(result.error.message,true);else{form.hidden=true;form.reset();form.dataset.id="";say("Saved");load()}});
  await load();
 }
 async function renderPreference(panel){
  panel.replaceChildren(node("h2","",state.module));
  const key=state.module==="Direction"?"direction":"language";
  const options=state.module==="Direction"?[{value:"ltr",label:"LTR"},{value:"rtl",label:"RTL"}]:[{value:"en",label:"English"},{value:"bn",label:"Bangla"},{value:"ar",label:"Arabic"}];

  const save=button("Save","button button--primary",async()=>{const {error}=await supabase.from("site_preferences").update({preference_value:select.value,updated_at:new Date().toISOString()}).eq("preference_key",key);if(error)say(error.message,true);else{await window.sitePreferences?.refresh();say("Saved")}});
  panel.append(select,save);
  const {data,error}=await supabase.from("site_preferences").select("preference_value").eq("preference_key",key).single();if(error)throw error;select.value=data.preference_value;
 }
 async function renderSiteSetting(panel){
  panel.replaceChildren(node("h2","",state.module));
  const key=state.module==="Website Logo"?"website_logo":state.module==="Website Title"?"website_title":"intro";
  const {data,error}=await supabase.from("site_preferences").select("preference_value").eq("preference_key",key).single();if(error)throw error;
  const form=node("form","dashboard__manager-form");

  if(key==="website_logo")input.type="url";
  form.append(input);const save=node("button","button button--primary","Save");save.type="submit";form.append(save);
  form.addEventListener("submit",async e=>{e.preventDefault();const {error}=await supabase.from("site_preferences").update({preference_value:input.value.trim(),updated_at:new Date().toISOString()}).eq("preference_key",key);if(error)say(error.message,true);else{say("Saved");await window.sitePreferences?.refresh()}});
  panel.append(form);
 }
 async function renderHomepageManager(panel){
  panel.replaceChildren(node("h2","","Homepage Management"));
  const {data,error}=await supabase.from("homepage_module_settings").select("module,is_enabled,sort_order").order("sort_order");if(error)throw error;
  data.forEach(item=>{const row=node("div","dashboard__item",item.module);const select=node("select");[["true","Show"],["false","Hide"]].forEach(([v,l])=>{const o=node("option","",l);o.value=v;select.append(o)});select.value=String(item.is_enabled);select.addEventListener("change",async()=>{const {error}=await supabase.from("homepage_module_settings").update({is_enabled:select.value==="true",updated_at:new Date().toISOString()}).eq("module",item.module);if(error)say(error.message,true);else say("Saved")});row.append(select);panel.append(row)});
 }
 async function renderDetailsManager(panel){
  panel.replaceChildren(node("h2","","Details Management"));
  const select=node("select");Object.keys(fields).forEach(module=>{const o=node("option","",module);o.value=module;select.append(o)});
  const list=node("div","dashboard__field-order-list"),save=button("Save Order","button button--primary",async()=>{
   const order=[...list.querySelectorAll("[data-key]")].map(x=>x.dataset.key);
   const {error}=await supabase.from("module_field_orders").upsert({module:select.value,field_order:order,updated_at:new Date().toISOString()},{onConflict:"module"});
   if(error)say(error.message,true);else say("Saved");
  });
  const draw=async()=>{list.replaceChildren();const {data,error}=await supabase.from("module_field_orders").select("field_order").eq("module",select.value).maybeSingle();if(error)throw error;const available=fields[select.value]||[];const order=Array.isArray(data?.field_order)?data.field_order:[];const keys=[...order.filter(k=>available.some(x=>x[0]===k)),...available.map(x=>x[0]).filter(k=>!order.includes(k))];keys.forEach((key,index)=>{const row=node("div","dashboard__field-order-row");row.dataset.key=key;row.append(node("span","",available.find(x=>x[0]===key)?.[1]||key));row.append(button("↑","button button--ghost",()=>{if(index>0){const a=list.children[index-1];list.insertBefore(row,a)}}),button("↓","button button--ghost",()=>{if(index<list.children.length-1)list.insertBefore(list.children[index+1],row)}));list.append(row)})};
  select.addEventListener("change",()=>draw().catch(e=>say(e.message,true)));panel.append(select,list,save);await draw();
 }
 async function renderIconManager(panel){
  panel.replaceChildren(node("h2","","Icon"));
  const list=node("div","dashboard__list"),form=node("form","dashboard__manager-form");
  const key=field(form,"Icon key","icon_key"),label=field(form,"Label","label"),category=field(form,"Category","category"),svg=field(form,"SVG Code","svg_code");
  svg.tagName==="INPUT"&&(svg.outerHTML="<textarea name='svg_code' placeholder='SVG Code' required></textarea>");
  const textarea=form.querySelector("textarea[name='svg_code']");
  const desc=field(form,"Description","description");
  const active=node("input");active.type="checkbox";active.checked=true;form.append(active);
  const save=node("button","button button--primary","Save");save.type="submit";form.append(save);
  const create=button("Create","button button--secondary",()=>{form.hidden=false;form.reset();key.disabled=false;active.checked=true;form.dataset.id=""});
  panel.append(create,form,list);form.hidden=true;
  const load=async()=>{const {data,error}=await supabase.from("site_svg_icons").select("id,icon_key,label,category,svg_code,description,is_active").order("category").order("icon_key");if(error)throw error;list.replaceChildren();(data||[]).forEach(x=>{const row=node("div","dashboard__item",x.label+" · "+x.icon_key);row.append(button("Edit","button button--ghost",()=>{form.hidden=false;form.dataset.id=x.id;key.value=x.icon_key;key.disabled=true;label.value=x.label;category.value=x.category;textarea.value=x.svg_code;desc.value=x.description||"";active.checked=x.is_active}));list.append(row)})};
  form.addEventListener("submit",async e=>{e.preventDefault();const payload={icon_key:key.value.trim(),label:label.value.trim(),category:category.value.trim(),svg_code:textarea.value.trim(),description:desc.value.trim()||null,is_active:active.checked};const result=form.dataset.id?await supabase.from("site_svg_icons").update({label:payload.label,category:payload.category,svg_code:payload.svg_code,description:payload.description,is_active:payload.is_active}).eq("id",form.dataset.id):await supabase.from("site_svg_icons").insert(payload);if(result.error)say(result.error.message,true);else{form.hidden=true;form.reset();key.disabled=false;form.dataset.id="";await load();say("Saved")}});
  await load();
 }
 async function renderModule(forceForm=false){
  const panel=$("dashboard-panel");panel.replaceChildren();say("");
  try{
   if(["Services","Products","Technician","Workshop","Gallery","Contacts","Location","Images","Videos"].includes(state.module)){
    await loadRoles();await renderContentModule(panel);
    if(forceForm)renderContentForm(panel,null);else if(state.selected)renderContentForm(panel,state.selected);
   }else if(["User","Role","Permission"].includes(state.module))await renderAdmin(panel);
   else if(["Region","Theme"].includes(state.module))await renderConfig(panel);
   else if(state.module==="Direction"||state.module==="Language")await renderPreference(panel);
   else if(["Website Logo","Website Title","Intro"].includes(state.module))await renderSiteSetting(panel);
   else if(state.module==="Homepage Management")await renderHomepageManager(panel);
   else if(state.module==="Details Management")await renderDetailsManager(panel);
   else if(state.module==="Icon")await renderIconManager(panel);
  }catch(error){say(error.message||"Unable to load module.",true)}
 }
 renderNavigation();renderModule();
 window.addEventListener("3b:global-update",()=>renderModule());
}
</script>
</head>
<body>
<main class="container dashboard dashboard--notion">
<nav id="dashboard-categories" class="dashboard-categories" aria-label="Dashboard categories"></nav>
<nav id="dashboard-modules" class="dashboard-modules" aria-label="Dashboard modules"></nav>
<section id="dashboard-panel" class="dashboard__panel"></section>
<p id="dashboard-status" class="dashboard__status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
