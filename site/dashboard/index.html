<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../global.css">
<link rel="stylesheet" href="../navigation.css">
<script src="../navigation.js" defer></script>
<title>Dashboard</title>
<style>
  body { visibility: hidden; }
  html.authenticated body { visibility: visible; }
</style>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.119.1";

  const supabase = createClient(
    "https://sburxeuxkrilbfppxylm.supabase.co",
    "sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT"
  );

  const accountUrl = new URL("../account/", window.location.href);
  accountUrl.searchParams.set("returnTo", window.location.href);

  try {
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session) {
      window.location.replace(accountUrl.href);
    } else {
      document.documentElement.classList.add("authenticated");
    }
  } catch (_) {
    window.location.replace(accountUrl.href);
  }
</script>
</head>
<body>
</body>
</html>
