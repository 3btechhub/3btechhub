<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../global.css">
<link rel="stylesheet" href="../navigation.css">
<script src="../navigation.js" defer></script>
<title>Dashboard</title>
<style>
body{visibility:hidden}html.authenticated body{visibility:visible}
.dashboard{padding-block:28px 100px}.dashboard__tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}
.dashboard__tab{flex:0 0 auto;min-height:42px;padding:9px 18px;border:1px solid var(--color-border);border-radius:var(--radius-pill);background:var(--color-surface-raised);color:var(--color-text);font-weight:600}
.dashboard__tab[aria-selected=true]{background:var(--color-accent);color:var(--color-accent-contrast);border-color:var(--color-accent)}
.dashboard__layout{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(0,1.4fr);gap:20px;align-items:start}
.dashboard__panel{min-width:0;padding:20px;border:1px solid var(--color-border);border-radius:var(--radius-large);background:var(--color-surface-raised)}
.dashboard__panel h2{font-size:20px;margin-bottom:16px}.dashboard__list{display:grid;gap:8px;max-height:65vh;overflow:auto}
.dashboard__item{width:100%;display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-medium);background:var(--color-surface);color:var(--color-text);text-align:left}
.dashboard__item[aria-current=true]{border-color:var(--color-text)}.dashboard__item small{display:block;color:var(--color-muted);overflow-wrap:anywhere}
.dashboard__field{display:grid;gap:6px;margin-bottom:16px}.dashboard__visibility,.dashboard__option{display:flex;align-items:center;gap:10px;margin:6px 0 20px;font-size:14px}
.dashboard__visibility input,.dashboard__option input{width:18px;height:18px;min-height:0}
.dashboard__actions{display:flex;flex-wrap:wrap;gap:8px}.dashboard__status{min-height:22px;margin:12px 0;color:var(--color-muted);font-size:14px}
.dashboard__empty{padding:22px 10px;color:var(--color-muted);text-align:center}.dashboard__stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.dashboard__stat{padding:16px;border:1px solid var(--color-border);border-radius:var(--radius-medium);background:var(--color-surface)}.dashboard__stat strong{display:block;font-size:24px}
.dashboard__relation-groups{display:grid;gap:14px;margin:18px 0}.dashboard__relation-group{padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-medium)}
.dashboard__relation-group h3{font-size:15px;margin-bottom:10px}.dashboard__relation-options{display:grid;gap:8px}.dashboard__option{margin:0;font-weight:400}
.dashboard__hint{color:var(--color-muted);font-size:12px}[hidden]{display:none!important}
@media(max-width:720px){.dashboard__layout{grid-template-columns:1fr}.dashboard__list{max-height:280px}}
</style>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.1";
const supabase=createClient("https://sburxeuxkrilbfppxylm.supabase.co","sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT");
const accountUrl=new URL("../account/",window.location.href);accountUrl.searchParams.set("returnTo",window.location.href);
const {data:{session},error:authError}=await supabase.auth.getSession();
if(authError||!session)window.location.replace(accountUrl.href);else{document.documentElement.classList.add("authenticated");startDashboard()}
function startDashboard(){
 const types=["Services","Products","Providers","Contacts","Images","Videos"],$=id=>document.getElementById(id);
 const state={tab:"Overview",items:[],selected:null,sourceType:"Services",sourceId:"",related:new Set(),busy:false,slugEdited:false};
 const tabs=$("dashboard-tabs"),status=$("status");
 const say=(m,bad=false)=>{status.textContent=m;status.style.color=bad?"#c0392b":"var(--color-muted)"};
 const setBusy=v=>{state.busy=v;["content-save","relation-save","content-cancel"].forEach(id=>$(id).disabled=v);$("content-delete").disabled=v||!state.selected};
 function tabButton(name){const b=document.createElement("button");b.type="button";b.className="dashboard__tab";b.textContent=name;b.setAttribute("aria-selected",String(state.tab===name));b.addEventListener("click",()=>showTab(name));return b}
 function showTab(name){state.tab=name;tabs.replaceChildren(...["Overview","Content","Relation"].map(tabButton));$("overview-panel").hidden=name!=="Overview";$("content-panel").hidden=name!=="Content";$("relation-panel").hidden=name!=="Relation";say("");if(name==="Overview")renderOverview();if(name==="Content")loadContent();if(name==="Relation")loadRelationItems()}
 async function loadAll(){const {data,error}=await supabase.from("content").select("id,type,name,slug,is_visible,skills,label,value,image_url,file_title,created_at").order("created_at",{ascending:false});if(error){say(error.message,true);return false}state.items=data||[];return true}
 function renderOverview(){const root=$("overview-stats");root.replaceChildren();[{name:"All Content",count:state.items.length},...types.map(type=>({name:type,count:state.items.filter(x=>x.type===type).length}))].forEach(x=>{const card=document.createElement("div");card.className="dashboard__stat";const n=document.createElement("strong");n.textContent=x.count;const label=document.createElement("span");label.textContent=x.name;card.append(n,label);root.append(card)})}
 function renderContentList(){const root=$("content-list");root.replaceChildren();const list=state.items.filter(x=>x.type===$("content-type").value);if(!list.length){const e=document.createElement("p");e.className="dashboard__empty";e.textContent="No existing items";root.append(e);return}list.forEach(item=>{const b=document.createElement("button");b.type="button";b.className="dashboard__item";b.setAttribute("aria-current",String(state.selected===item.id));const s=document.createElement("span");s.textContent=item.name;const meta=document.createElement("small");meta.textContent=item.slug+(item.is_visible?"":" · Hidden");s.append(meta);b.append(s);b.addEventListener("click",()=>editContent(item));root.append(b)})}
 async function loadContent(){if(await loadAll())renderContentList()}
 function makeField(id,label,type="text"){const wrap=document.createElement("div");wrap.className="dashboard__field";const l=document.createElement("label");l.htmlFor=id;l.textContent=label;const input=document.createElement("input");input.id=id;input.type=type;input.autocomplete="off";wrap.append(l,input);return wrap}
 function renderTypeFields(type,item={}){
  const root=$("type-fields");root.replaceChildren();
  const add=(id,label,inputType="text",value="")=>{const wrap=makeField(id,label,inputType),input=wrap.querySelector("input");input.value=value||"";root.append(wrap);return input};
  if(["Services","Products","Providers"].includes(type)){
   const slug=add("content-slug","Slug","text",item.slug);slug.maxLength=180;slug.pattern="[a-z0-9]+(-[a-z0-9]+)*";slug.required=true;
   if(type==="Providers")add("content-skills","Skills","text",item.skills);
  }
  if(type==="Contacts"){add("content-label","Label","text",item.label);add("content-value","Value","text",item.value)}
  if(type==="Images"||type==="Videos"){
   const fileWrap=document.createElement("div");fileWrap.className="dashboard__field";const label=document.createElement("label");label.htmlFor="content-upload";label.textContent="Upload";const file=document.createElement("input");file.type="file";file.id="content-upload";file.accept=type==="Images"?"image/*":"video/*";fileWrap.append(label,file);const hint=document.createElement("small");hint.className="dashboard__hint";hint.textContent="Uploaded files are stored in Supabase Storage.";fileWrap.append(hint);root.append(fileWrap);
   const url=add("content-image-url","Image URL","url",item.image_url);url.placeholder="Upload a file or enter a URL";
   if(type==="Videos"){const title=add("content-file-title","File Title","text",item.file_title);title.readOnly=true;title.placeholder="Set automatically from uploaded file";file.addEventListener("change",()=>{title.value=file.files?.[0]?.name||item.file_title||""})}
  }
 }
 function resetContent(){state.selected=null;state.slugEdited=false;$("content-form").reset();$("content-name").value="";$("content-visible").checked=true;renderTypeFields($("content-form-type").value);$("content-delete").disabled=true;renderContentList()}
 function editContent(item){state.selected=item.id;state.slugEdited=true;$("content-name").value=item.name;$("content-type").value=item.type;$("content-form-type").value=item.type;$("content-visible").checked=item.is_visible;renderTypeFields(item.type,item);$("content-delete").disabled=false;renderContentList();say("Item loaded")}
 $("content-type").addEventListener("change",()=>{ $("content-form-type").value=$("content-type").value;resetContent()});
 $("content-form-type").addEventListener("change",()=>{state.selected=null;state.slugEdited=false;renderTypeFields($("content-form-type").value);$("content-delete").disabled=true;renderContentList()});
 $("content-name").addEventListener("input",()=>{if(state.slugEdited)return;const slug=$("content-slug");if(slug)slug.value=$("content-name").value.trim().toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").replace(/-{2,}/g,"-")});
 $("type-fields").addEventListener("input",e=>{if(e.target.id==="content-slug")state.slugEdited=true});
 async function uploadSelectedFile(type,slug){
  const file=$("content-upload")?.files?.[0];if(!file)return $("content-image-url")?.value.trim()||null;
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");const safeSlug=(slug||"upload").replace(/[^a-z0-9-]/g,"-");const path=type.toLowerCase()+"/"+safeSlug+"/"+crypto.randomUUID()+"."+ext;
  const {data,error}=await supabase.storage.from("site-media").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type||undefined});
  if(error)throw error;return data.path;
 }
 $("content-form").addEventListener("submit",async e=>{
  e.preventDefault();if(state.busy)return;const type=$("content-form-type").value,name=$("content-name").value.trim();let slug=$("content-slug")?.value.trim().toLowerCase()||name.toLowerCase().normalize("NFKD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").replace(/-{2,}/g,"-");
  if(["Services","Products","Providers"].includes(type)&&(!slug||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))){say("Enter a valid slug.",true);return}
  if(!name){say("Enter a name.",true);return}
  setBusy(true);
  try{
   const payload={name,type,is_visible:$("content-visible").checked,updated_at:new Date().toISOString(),slug,skills:type==="Providers"?$("content-skills").value.trim()||null:null,label:type==="Contacts"?$("content-label").value.trim()||null:null,value:type==="Contacts"?$("content-value").value:null,image_url:["Images","Videos"].includes(type)?await uploadSelectedFile(type,slug||name.toLowerCase().replace(/[^a-z0-9]+/g,"-")):null,file_title:type==="Videos"?($("content-upload").files[0]?.name||$("content-file-title").value||null):null};
   const q=state.selected?supabase.from("content").update(payload).eq("id",state.selected):supabase.from("content").insert(payload);
   const {error}=await q;if(error)throw error;say(state.selected?"Updated":"Created");$("content-type").value=type;resetContent();await loadContent();
  }catch(error){say(error.message||"Could not save content.",true)}finally{setBusy(false)}
 });
 $("content-cancel").addEventListener("click",()=>{resetContent();say("")});
 $("content-delete").addEventListener("click",async()=>{if(!state.selected||state.busy||!confirm("Delete this item and its relations?"))return;setBusy(true);const {error}=await supabase.from("content").delete().eq("id",state.selected);if(error)say(error.message,true);else{say("Deleted");resetContent();await loadContent()}setBusy(false)});
 function fillSelect(select,items,placeholder){select.replaceChildren();const p=document.createElement("option");p.value="";p.textContent=placeholder;select.append(p);items.forEach(item=>{const o=document.createElement("option");o.value=item.id;o.textContent=item.name;select.append(o)})}
 async function loadRelationItems(){if(!await loadAll())return;fillSelect($("source-type"),types.map(t=>({id:t,name:t})),"Select type");$("source-type").value=state.sourceType;fillSourceItems()}
 function fillSourceItems(){fillSelect($("source-name"),state.items.filter(x=>x.type===state.sourceType),"Select item");$("source-name").value=state.sourceId;renderTargets()}
 $("source-type").addEventListener("change",()=>{state.sourceType=$("source-type").value;state.sourceId="";state.related.clear();fillSourceItems()});
 $("source-name").addEventListener("change",async()=>{state.sourceId=$("source-name").value;state.related.clear();await renderTargets()});
 async function renderTargets(){const area=$("target-section"),groups=$("target-groups"),existing=$("relation-existing");groups.replaceChildren();existing.replaceChildren();if(!state.sourceId){area.hidden=true;return}area.hidden=false;const {data,error}=await supabase.from("relation").select("source_id,target_id").or("source_id.eq."+state.sourceId+",target_id.eq."+state.sourceId);if(error){say(error.message,true);return}state.related=new Set((data||[]).map(r=>r.source_id===state.sourceId?r.target_id:r.source_id));types.forEach(type=>{const section=document.createElement("section");section.className="dashboard__relation-group";const h=document.createElement("h3");h.textContent=type;const options=document.createElement("div");options.className="dashboard__relation-options";const candidates=state.items.filter(x=>x.type===type&&x.id!==state.sourceId);if(!candidates.length){const empty=document.createElement("small");empty.textContent="No existing items";options.append(empty)}candidates.forEach(item=>{const label=document.createElement("label");label.className="dashboard__option";const cb=document.createElement("input");cb.type="checkbox";cb.checked=state.related.has(item.id);cb.value=item.id;cb.addEventListener("change",()=>{if(cb.checked)state.related.add(item.id);else state.related.delete(item.id);renderExistingRelations()});const span=document.createElement("span");span.textContent=item.name;label.append(cb,span);options.append(label)});section.append(h,options);groups.append(section)});renderExistingRelations()}
 function renderExistingRelations(){const root=$("relation-existing");root.replaceChildren();const names=state.items.filter(x=>state.related.has(x.id));if(!names.length){const p=document.createElement("p");p.className="dashboard__empty";p.textContent="No selected relations";root.append(p);return}names.forEach(x=>{const p=document.createElement("p");p.textContent=x.type+" — "+x.name;root.append(p)})}
 $("relation-save").addEventListener("click",async()=>{if(!state.sourceId||state.busy){say("Select a source item first.",true);return}setBusy(true);const source=state.sourceId;const {data:oldRows,error:readError}=await supabase.from("relation").select("id,source_id,target_id").or("source_id.eq."+source+",target_id.eq."+source);if(readError){say(readError.message,true);setBusy(false);return}const oldMap=new Map((oldRows||[]).map(r=>[r.source_id===source?r.target_id:r.source_id,r.id]));const remove=[...oldMap].filter(([id])=>!state.related.has(id)).map(([,id])=>id);const add=[...state.related].filter(id=>!oldMap.has(id)).map(id=>({source_id:source,target_id:id}));let failure=null;if(remove.length){const {error}=await supabase.from("relation").delete().in("id",remove);failure=error}if(!failure&&add.length){const {error}=await supabase.from("relation").insert(add);failure=error}say(failure?failure.message:"Relations saved",!!failure);setBusy(false);if(!failure)await renderTargets()});
 $("content-form-type").value="Services";renderTypeFields("Services");loadAll().then(ok=>{if(ok){renderOverview();showTab("Overview")}});
}
</script>
</head>
<body>
<main class="container dashboard">
<header class="page-header"><h1>Dashboard</h1></header>
<nav class="dashboard__tabs" id="dashboard-tabs" aria-label="Dashboard sections"></nav>
<section id="overview-panel" class="dashboard__panel"><h2>Overview</h2><div class="dashboard__stats" id="overview-stats"></div></section>
<section id="content-panel" hidden><div class="dashboard__layout">
<section class="dashboard__panel"><h2>Existed Item List</h2><div class="dashboard__field"><label for="content-type">Type</label><select id="content-type"><option>Services</option><option>Products</option><option>Providers</option><option>Contacts</option><option>Images</option><option>Videos</option></select></div><div class="dashboard__list" id="content-list"></div></section>
<section class="dashboard__panel"><h2>Content</h2><form id="content-form">
<div class="dashboard__field"><label for="content-name">Name</label><input id="content-name" maxlength="160" required autocomplete="off"></div>
<div class="dashboard__field"><label for="content-form-type">Type</label><select id="content-form-type"><option>Services</option><option>Products</option><option>Providers</option><option>Contacts</option><option>Images</option><option>Videos</option></select></div>
<div id="type-fields"></div>
<label class="dashboard__visibility"><input id="content-visible" type="checkbox" checked> Visibility</label>
<div class="dashboard__actions"><button class="button button--primary" id="content-save" type="submit">Save</button><button class="button button--secondary" id="content-cancel" type="button">Cancel</button><button class="button button--secondary" id="content-delete" type="button" disabled>Delete</button></div>
</form></section></div></section>
<section id="relation-panel" class="dashboard__panel" hidden><h2>Relation</h2>
<div class="dashboard__field"><label for="source-type">Source Section — Item Type</label><select id="source-type"><option value="">Select type</option></select></div>
<div class="dashboard__field"><label for="source-name">Item Name</label><select id="source-name"><option value="">Select item</option></select></div>
<div id="target-section" hidden><h2>Target Section</h2><div class="dashboard__relation-groups" id="target-groups"></div><h2>Existed Item List</h2><div id="relation-existing"></div><div class="dashboard__actions"><button class="button button--primary" id="relation-save" type="button">Save Relations</button></div></div>
</section>
<p class="dashboard__status" id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
