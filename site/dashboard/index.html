<script type="module">

import {connectGlobalRealtime} from "../realtime.js";
import {initSiteIcons} from "../icons.js";
const supabase=createClient("https://sburxeuxkrilbfppxylm.supabase.co","sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT");
const accountUrl=new URL("../account/",window.location.href);accountUrl.searchParams.set("returnTo",window.location.href);
const OWNER_ID="0074818e-942d-4752-ada2-01a11e291ff4";
const {data:{session},error:authError}=await supabase.auth.getSession();
if(authError||!session)window.location.replace(accountUrl.href);

function startDashboard(){
 connectGlobalRealtime(supabase);
 initSiteIcons(supabase);
 const types=["Services","Products","Providers","Hubs","Contacts","Images","Videos"],$=id=>document.getElementById(id);
 const state={tab:"Content",subtab:"Existed List",items:[],roles:[],visibility:new Map(),selected:null,sourceType:"Services",sourceId:"",related:new Set(),busy:false,slugEdited:false};
 const tabs=$("dashboard-tabs"),status=$("status");
 const say=(m,bad=false)=>{status.textContent=m;status.style.color=bad?"#c0392b":"var(--color-muted)"};
 const iconize=(button,key)=>{const icon=document.createElement("span");icon.dataset.siteIcon=key;icon.setAttribute("aria-hidden","true");button.append(icon)};
 const setBusy=v=>{state.busy=v;["content-save","relation-save","content-cancel"].forEach(id=>$(id).disabled=v);$("content-roles").querySelectorAll("input").forEach(input=>input.disabled=v);$("content-delete").disabled=v||!state.selected};
 function tabButton(name,active,onSelect){const b=document.createElement("button");b.type="button";b.className="dashboard__tab";const iconKey={Content:"dashboard.content",Administration:"dashboard.administration",Settings:"dashboard.settings","Existed List":"action.search","Create Form":"action.create","Relation Form":"dashboard.content",User:"field.name",Role:"dashboard.administration",Permission:"field.visibility",Region:"field.location",Direction:"layout.home",Language:"field.name",Theme:"theme.dark","Home Page Section Management":"layout.home","SVG Icons":"field.image"}[name];const label=document.createElement("span");label.textContent=name;b.append(label);if(iconKey){const icon=document.createElement("span");icon.dataset.siteIcon=iconKey;icon.setAttribute("aria-hidden","true");b.append(icon)}b.setAttribute("aria-selected",String(active===name));b.addEventListener("click",()=>onSelect(name));return b}
 function renderSubtabs(){const configs={Content:["Existed List","Create Form","Relation Form"],Administration:["User","Role","Permission"],Settings:["Region","Direction","Language","Theme","Home Page Section Management","SVG Icons"]};const nav=$(state.tab.toLowerCase()+"-subtabs");if(!nav)return;nav.replaceChildren(...(configs[state.tab]||[]).map(n=>tabButton(n,state.subtab,x=>showSubtab(x))));}

 async function callUserAdmin(body){const {data,error}=await supabase.functions.invoke("owner-users",{body});if(error)throw error;return data}
 function managerShell(panel,kind){
  panel.innerHTML="";
  const title=document.createElement("h2");title.textContent=kind;panel.append(title);
  const actions=document.createElement("div");actions.className="dashboard__actions";
  const create=document.createElement("button");create.type="button";create.className="button button--primary";create.textContent="Create";const createIcon=document.createElement("span");createIcon.dataset.siteIcon="action.create";create.append(createIcon);
  const hide=document.createElement("button");hide.type="button";hide.className="button button--secondary";hide.textContent="Hide";iconize(hide,"action.cancel");hide.hidden=true;actions.append(create,hide);panel.append(actions);
  const form=document.createElement("form");form.hidden=true;form.className="dashboard__manager-form";
  const listTitle=document.createElement("h3");listTitle.textContent="Existed Item List";
  const list=document.createElement("div");list.className="dashboard__list";
  panel.append(form,listTitle,list);
  create.addEventListener("click",()=>{form.hidden=false;hide.hidden=false;form.reset();form.dataset.edit="";form.dataset.id="";form.querySelectorAll("[data-permission]").forEach(x=>x.checked=false)});
  hide.addEventListener("click",()=>{form.hidden=true;hide.hidden=true;form.reset();form.dataset.edit="";form.dataset.id=""});
  return {form,list,create,hide};
 }
 function field(form,label,type="text",name="name"){
  const wrap=document.createElement("div");wrap.className="dashboard__field";
  const input=document.createElement("input");input.type=type;input.name=name;input.placeholder=label;input.setAttribute("aria-label",label);input.required=true;
  wrap.append(input);form.append(wrap);return input;
 }
 function managerButtons(form,allowDelete=true){
  const actions=document.createElement("div");actions.className="dashboard__actions";
  const save=document.createElement("button");save.type="submit";save.className="button button--primary";save.textContent="Save";iconize(save,"action.save");
  const cancel=document.createElement("button");cancel.type="button";cancel.className="button button--secondary";cancel.textContent="Cancel";iconize(cancel,"action.cancel");cancel.addEventListener("click",()=>{form.hidden=true;form.reset();form.dataset.edit="";form.dataset.id=""});
  actions.append(save,cancel);
  if(allowDelete){const del=document.createElement("button");del.type="button";del.className="button button--secondary";del.textContent="Delete";iconize(del,"action.delete");del.hidden=true;del.dataset.delete="";actions.append(del)}
  form.append(actions);return actions;
 }
 function renderSimpleManager(panel,category){
  const ui=managerShell(panel,category),form=ui.form;
  const name=field(form,category+" name");
  const actions=managerButtons(form);
  const del=actions.querySelector("[data-delete]");
  const table=category==="Permission"?"permissions":category==="Role"?"roles":"configuration_items";
  const config=["Region","Language","Theme"].includes(category);
  const load=async()=>{
   let q=supabase.from(table).select(config?"id,name,is_permanent":"name,is_permanent").order("name");
   if(config)q=q.eq("category",category);
   const {data,error}=await q;if(error)throw error;
   ui.list.replaceChildren();
   if(!data?.length){const p=document.createElement("p");p.className="dashboard__empty";p.textContent="No existing items";ui.list.append(p)}
   (data||[]).forEach(item=>{
    const row=document.createElement("div");row.className="dashboard__item";
    const info=document.createElement("span");info.textContent=item.name;
    if(item.is_permanent){const badge=document.createElement("small");badge.textContent="Permanent";info.append(badge)}
    row.append(info);
    if(!item.is_permanent){const edit=document.createElement("button");edit.type="button";edit.className="button button--secondary";edit.textContent="Edit";iconize(edit,"action.edit");edit.addEventListener("click",()=>{form.hidden=false;ui.hide.hidden=false;name.value=item.name;form.dataset.edit="true";form.dataset.id=item.id||item.name;del.hidden=false});row.append(edit)}
    ui.list.append(row);
   });
  };
  form.addEventListener("submit",async e=>{
   e.preventDefault();if(!name.value.trim())return;
   try{
    if(config){
     const payload={category,name:name.value.trim()};
     const result=form.dataset.edit==="true"?await supabase.from(table).update({name:payload.name}).eq("id",form.dataset.id):await supabase.from(table).insert(payload);
     if(result.error)throw result.error;
    }else{
     const result=form.dataset.edit==="true"?await supabase.from(table).update({name:name.value.trim()}).eq("name",form.dataset.id):await supabase.from(table).insert({name:name.value.trim()});
     if(result.error)throw result.error;
    }
    form.hidden=true;ui.hide.hidden=true;form.reset();form.dataset.edit="";form.dataset.id="";del.hidden=true;await load();say(category+" saved");
   }catch(err){say(err.message,true)}
  });
  del.addEventListener("click",async()=>{
   if(!form.dataset.id||!confirm("Delete this item?"))return;
   try{const result=config?await supabase.from(table).delete().eq("id",form.dataset.id):await supabase.from(table).delete().eq("name",form.dataset.id);if(result.error)throw result.error;form.hidden=true;ui.hide.hidden=true;del.hidden=true;form.reset();form.dataset.id="";await load();say(category+" deleted")}catch(err){say(err.message,true)}
  });
  panel.__globalRefresh=load;
  load().catch(err=>say(err.message,true));
 }
 function renderRoleManager(panel){
  const ui=managerShell(panel,"Role"),form=ui.form,name=field(form,"Role name");
  const permTitle=document.createElement("p");permTitle.textContent="Permissions";form.append(permTitle);
  const permArea=document.createElement("div");permArea.className="dashboard__relation-options";form.append(permArea);
  const actions=managerButtons(form),del=actions.querySelector("[data-delete]");
  let permissions=[];
  const load=async()=>{
   const [{data:roles,error:rErr},{data:perms,error:pErr}]=await Promise.all([supabase.from("roles").select("name,is_permanent").order("name"),supabase.from("permissions").select("name").order("name")]);
   if(rErr)throw rErr;if(pErr)throw pErr;permissions=perms||[];permArea.replaceChildren();
   permissions.forEach(p=>{const label=document.createElement("label");label.className="dashboard__option";const cb=document.createElement("input");cb.type="checkbox";cb.value=p.name;cb.dataset.permission="";const span=document.createElement("span");span.textContent=p.name;label.append(cb,span);permArea.append(label)});
   ui.list.replaceChildren();
   (roles||[]).forEach(role=>{const row=document.createElement("div");row.className="dashboard__item";const info=document.createElement("span");info.textContent=role.name;if(role.is_permanent){const b=document.createElement("small");b.textContent="Permanent";info.append(b)}row.append(info);
    const edit=document.createElement("button");edit.type="button";edit.className="button button--secondary";edit.textContent="Permissions";iconize(edit,"field.visibility");edit.addEventListener("click",async()=>{form.hidden=false;ui.hide.hidden=false;name.value=role.name;name.disabled=!!role.is_permanent;form.dataset.id=role.name;form.dataset.edit="true";del.hidden=!!role.is_permanent;const {data,error}=await supabase.from("role_permissions").select("permission_name").eq("role_name",role.name);if(error){say(error.message,true);return}const chosen=new Set((data||[]).map(x=>x.permission_name));permArea.querySelectorAll("input").forEach(cb=>cb.checked=chosen.has(cb.value))});row.append(edit);ui.list.append(row)});
   if(!(roles||[]).length){const p=document.createElement("p");p.className="dashboard__empty";p.textContent="No existing roles";ui.list.append(p)}
  };
  form.addEventListener("submit",async e=>{e.preventDefault();try{
   let role=form.dataset.id;
   if(form.dataset.edit!=="true"){role=name.value.trim();const {error}=await supabase.from("roles").insert({name:role});if(error)throw error}
   const selected=[...permArea.querySelectorAll("input:checked")].map(cb=>cb.value);
   const {error:clearError}=await supabase.from("role_permissions").delete().eq("role_name",role);if(clearError)throw clearError;
   if(selected.length){const {error}=await supabase.from("role_permissions").insert(selected.map(permission_name=>({role_name:role,permission_name})));if(error)throw error}
   form.hidden=true;ui.hide.hidden=true;form.reset();name.disabled=false;form.dataset.id="";form.dataset.edit="";del.hidden=true;await load();say("Role saved");
  }catch(err){say(err.message,true)}});
  del.addEventListener("click",async()=>{if(!form.dataset.id||!confirm("Delete this role?"))return;try{const {error}=await supabase.from("roles").delete().eq("name",form.dataset.id);if(error)throw error;form.hidden=true;ui.hide.hidden=true;name.disabled=false;form.dataset.id="";form.dataset.edit="";del.hidden=true;await load();say("Role deleted")}catch(err){say(err.message,true)}});
  panel.__globalRefresh=load;
  load().catch(err=>say(err.message,true));
 }
 function renderUserManager(panel){
  const ui=managerShell(panel,"User"),form=ui.form;
  const email=field(form,"Email","email","email"),name=field(form,"Name"),role=document.createElement("select");role.name="role";role.setAttribute("aria-label","Role");form.append(role);
  const actions=managerButtons(form),del=actions.querySelector("[data-delete]");
  const load=async()=>{
   const [{data:roles,error:rErr},users]=await Promise.all([supabase.from("roles").select("name").order("name"),callUserAdmin({action:"list",page:1,perPage:50})]);
   if(rErr)throw rErr;role.replaceChildren();(roles||[]).forEach(r=>{const o=document.createElement("option");o.value=r.name;o.textContent=r.name;role.append(o)});
   ui.list.replaceChildren();
   (users.users||[]).forEach(u=>{const row=document.createElement("div");row.className="dashboard__item";const info=document.createElement("span");info.textContent=(u.name||u.email)+" — "+u.role;
    if(u.protected){const b=document.createElement("small");b.textContent="Permanent";info.append(b)}
    row.append(info);
    if(!u.protected){const edit=document.createElement("button");edit.type="button";edit.className="button button--secondary";edit.textContent="Edit";edit.addEventListener("click",()=>{form.hidden=false;ui.hide.hidden=false;form.dataset.id=u.id;form.dataset.edit="true";email.value=u.email;email.disabled=true;name.value=u.name;role.value=u.role;del.hidden=false});row.append(edit)}
    ui.list.append(row);
   });
  };
  form.addEventListener("submit",async e=>{e.preventDefault();try{
   if(form.dataset.edit==="true"){await callUserAdmin({action:"update",userId:form.dataset.id,name:name.value.trim()});await callUserAdmin({action:"set-role",userId:form.dataset.id,role:role.value})}
   else await callUserAdmin({action:"invite",email:email.value.trim(),name:name.value.trim(),role:role.value});
   form.hidden=true;ui.hide.hidden=true;form.reset();form.dataset.id="";form.dataset.edit="";email.disabled=false;del.hidden=true;await load();say(form.dataset.edit==="true"?"User updated":"User saved");
  }catch(err){say(err.message,true)}});
  del.addEventListener("click",async()=>{if(!form.dataset.id||!confirm("Delete this user account?"))return;try{await callUserAdmin({action:"delete",userId:form.dataset.id});form.hidden=true;ui.hide.hidden=true;form.reset();form.dataset.id="";form.dataset.edit="";email.disabled=false;del.hidden=true;await load();say("User deleted")}catch(err){say(err.message,true)}});
  panel.__globalRefresh=load;
  load().catch(err=>say(err.message,true));
 }
 function renderHomePageManager(panel){
  panel.replaceChildren();
  const title=document.createElement("h2");title.textContent="Home Page Section Management";
  const hint=document.createElement("p");hint.className="dashboard__hint";hint.textContent="Choose which content type cards appear on the Home Page.";
  const list=document.createElement("div");list.className="dashboard__list dashboard__home-sections";
  panel.append(title,hint,list);
  const load=async()=>{
   const {data,error}=await supabase.from("homepage_type_settings").select("content_type,is_enabled,sort_order").order("sort_order");
   if(error)throw error;
   list.replaceChildren();
   (data||[]).forEach(item=>{
    const row=document.createElement("div");row.className="dashboard__item";
    const label=document.createElement("span");label.textContent=item.content_type;
    const select=document.createElement("select");select.setAttribute("aria-label",item.content_type+" home page display");
    [["true","Show"],["false","Hide"]].forEach(([value,text])=>{const option=document.createElement("option");option.value=value;option.textContent=text;select.append(option)});
    select.value=String(item.is_enabled);
    select.addEventListener("change",async()=>{
     select.disabled=true;
     try{const {error}=await supabase.from("homepage_type_settings").update({is_enabled:select.value==="true",updated_at:new Date().toISOString()}).eq("content_type",item.content_type);if(error)throw error;say(item.content_type+" card updated")}
     catch(err){select.value=String(item.is_enabled);say(err.message,true)}
     finally{select.disabled=false}
    });
    row.append(label,select);list.append(row);
   });
  };
  panel.__globalRefresh=load;
  load().catch(err=>say(err.message,true));
 }
 function renderSvgIconManager(panel){
  const ui=managerShell(panel,"SVG Icon Library"),form=ui.form;
  const key=field(form,"Unique icon key");
  const label=field(form,"Icon label");
  const category=document.createElement("select");category.setAttribute("aria-label","Category");
  ["Navigation","Module","Dashboard","Action","Status","Field","Layout","Media","Theme","Other"].forEach(value=>{const o=document.createElement("option");o.value=value;o.textContent=value;category.append(o)});
  form.append(category);
  const svgWrap=document.createElement("div");svgWrap.className="dashboard__field";
  const svgLabel=document.createElement("label");svgLabel.textContent="SVG Code";
  const svg=document.createElement("textarea");svg.name="svg_code";svg.placeholder="<svg viewBox=\"0 0 24 24\">...</svg>";svg.required=true;svg.rows=7;
  svgWrap.append(svgLabel,svg);form.append(svgWrap);
  const description=field(form,"Description");description.required=false;
  const activeWrap=document.createElement("label");activeWrap.className="dashboard__option";
  const active=document.createElement("input");active.type="checkbox";active.checked=true;
  const activeText=document.createElement("span");activeText.textContent="Active";activeWrap.append(active,activeText);form.append(activeWrap);
  const preview=document.createElement("div");preview.className="site-icon-preview";preview.setAttribute("aria-label","SVG preview");form.append(preview);
  const actions=managerButtons(form),del=actions.querySelector("[data-delete]");
  const safePreview=code=>{
   preview.replaceChildren();
   try{
    const doc=new DOMParser().parseFromString(code,"image/svg+xml"),root=doc.documentElement;
    const allowed=new Set(["svg","g","path","circle","rect","line","polyline","polygon","ellipse"]);
    const attrs=new Set(["viewBox","xmlns","fill","stroke","stroke-width","stroke-linecap","stroke-linejoin","d","cx","cy","r","x","y","width","height","points","rx","ry","fill-rule","clip-rule","transform"]);
    if(root.tagName.toLowerCase()!=="svg"||doc.querySelector("parsererror"))throw new Error("Invalid SVG");
    const clean=node=>{
     [...node.attributes].forEach(a=>{if(!attrs.has(a.name))node.removeAttribute(a.name)});
     [...node.children].forEach(child=>{if(!allowed.has(child.tagName.toLowerCase()))child.remove();else clean(child)});
    };
    clean(root);root.setAttribute("width","42");root.setAttribute("height","42");preview.append(document.importNode(root,true));
   }catch{preview.textContent="Invalid SVG preview"}
  };
  svg.addEventListener("input",()=>safePreview(svg.value));
  const load=async()=>{
   const {data,error}=await supabase.from("site_svg_icons").select("id,icon_key,label,category,svg_code,description,is_active").order("category").order("icon_key");
   if(error)throw error;ui.list.replaceChildren();
   if(!data?.length){const p=document.createElement("p");p.className="dashboard__empty";p.textContent="No icons found";ui.list.append(p)}
   data.forEach(item=>{
    const row=document.createElement("div");row.className="dashboard__item";
    const info=document.createElement("span");info.className="dashboard__item-info";
    const name=document.createElement("strong");name.textContent=item.label+" · "+item.icon_key;
    const meta=document.createElement("small");meta.className="dashboard__item-meta";meta.textContent=item.category+" · "+(item.is_active?"Active":"Inactive");
    info.append(name,meta);row.append(info);const icon=document.createElement("span");icon.dataset.siteIcon=item.icon_key;icon.setAttribute("aria-hidden","true");row.append(icon);
    const edit=document.createElement("button");edit.type="button";edit.className="button button--secondary";edit.textContent="Edit";
    edit.addEventListener("click",()=>{form.hidden=false;ui.hide.hidden=false;key.value=item.icon_key;key.disabled=true;label.value=item.label;category.value=item.category;svg.value=item.svg_code;description.value=item.description||"";active.checked=item.is_active;form.dataset.id=item.id;form.dataset.edit="true";del.hidden=false;safePreview(svg.value)});
    row.append(edit);ui.list.append(row);
   });
  };
  form.addEventListener("submit",async e=>{
   e.preventDefault();
   const payload={icon_key:key.value.trim(),label:label.value.trim(),category:category.value,svg_code:svg.value.trim(),description:description.value.trim()||null,is_active:active.checked};
   try{
    const result=form.dataset.edit==="true"?await supabase.from("site_svg_icons").update({label:payload.label,category:payload.category,svg_code:payload.svg_code,description:payload.description,is_active:payload.is_active}).eq("id",form.dataset.id):await supabase.from("site_svg_icons").insert(payload);
    if(result.error)throw result.error;
    form.hidden=true;ui.hide.hidden=true;form.reset();key.disabled=false;active.checked=true;form.dataset.id="";form.dataset.edit="";del.hidden=true;await load();say("SVG icon saved");
   }catch(err){say(err.message,true)}
  });
  del.addEventListener("click",async()=>{
   if(!form.dataset.id||!confirm("Delete this SVG icon?"))return;
   try{const {error}=await supabase.from("site_svg_icons").delete().eq("id",form.dataset.id);if(error)throw error;form.hidden=true;ui.hide.hidden=true;form.reset();key.disabled=false;form.dataset.id="";form.dataset.edit="";del.hidden=true;await load();say("SVG icon deleted")}catch(err){say(err.message,true)}
  });
  ui.create.addEventListener("click",()=>{key.disabled=false;active.checked=true;safePreview("")});
  panel.__globalRefresh=load;load().catch(err=>say(err.message,true));
 }
 function renderPreferenceManager(panel,key,title,options){
  panel.replaceChildren();
  const heading=document.createElement("h2");heading.textContent=title;
  const hint=document.createElement("p");hint.className="dashboard__hint";hint.textContent=key==="direction"?"Choose the website reading direction and icon placement.":"Choose the website language preference.";
  const select=document.createElement("select");select.setAttribute("aria-label",title);
  options.forEach(item=>{const option=document.createElement("option");option.value=item.value;option.textContent=item.label;select.append(option)});
  const statusText=document.createElement("p");statusText.className="dashboard__hint";statusText.setAttribute("role","status");
  panel.append(heading,hint,select,statusText);
  const load=async()=>{
   const {data,error}=await supabase.from("site_preferences").select("preference_value").eq("preference_key",key).single();
   if(error)throw error;
   select.value=data.preference_value;
  };
  select.addEventListener("change",async()=>{
   select.disabled=true;statusText.textContent="Saving…";
   try{
    const {error}=await supabase.from("site_preferences").update({preference_value:select.value,updated_at:new Date().toISOString()}).eq("preference_key",key);
    if(error)throw error;
    await window.sitePreferences?.refresh();
    statusText.textContent="Saved";
    say(title+" updated");
   }catch(error){statusText.textContent="Could not save";say(error.message,true);await load().catch(()=>{})}
   finally{select.disabled=false}
  });
  panel.__globalRefresh=load;
  load().catch(error=>say(error.message,true));
 }
 function renderManagementPanel(panel){
  if(panel.dataset.initialized==="true")return;panel.dataset.initialized="true";
  const name=panel.dataset.subtab;
  if(name==="User")renderUserManager(panel);
  else if(name==="Role")renderRoleManager(panel);
  else if(name==="Permission"||["Region","Theme"].includes(name))renderSimpleManager(panel,name);
  else if(name==="Direction")renderPreferenceManager(panel,"direction","Direction",[{value:"ltr",label:"LTR"},{value:"rtl",label:"RTL"}]);
  else if(name==="Language")renderPreferenceManager(panel,"language","Language",[{value:"en",label:"English"},{value:"bn",label:"Bangla"},{value:"ar",label:"Arabic"}]);
  else if(name==="Home Page Section Management")renderHomePageManager(panel);
  else if(name==="SVG Icons")renderSvgIconManager(panel);
 }

 function showSubtab(name){state.subtab=name;renderSubtabs();if(state.tab==="Content"){ $("existed-list-panel").hidden=name!=="Existed List";$("create-form-panel").hidden=name!=="Create Form";$("relation-form-panel").hidden=name!=="Relation Form";if(name==="Existed List")loadContent();if(name==="Relation Form")loadRelationItems();if(name==="Create Form"){say("");loadContentRoleOptions().catch(err=>say(err.message,true))}}else{const prefix=state.tab==="Administration"?"admin":"settings";document.querySelectorAll("[data-subtab-panel]").forEach(p=>{p.hidden=p.dataset.group!==prefix||p.dataset.subtab!==name;if(!p.hidden)renderManagementPanel(p)});}}
 function showTab(name){state.tab=name;const mainTabs=["Content","Administration","Settings"];tabs.replaceChildren(...mainTabs.map(n=>tabButton(n,name,x=>showTab(x))));$("content-panel").hidden=name!=="Content";$("administration-panel").hidden=name!=="Administration";$("settings-panel").hidden=name!=="Settings";say("");if(name==="Content"){if(!["Existed List","Create Form","Relation Form"].includes(state.subtab))state.subtab="Existed List";renderSubtabs();showSubtab(state.subtab)}if(name==="Administration"||name==="Settings"){if(!state.subtab||!(name==="Administration"?["User","Role","Permission"]:["Region","Direction","Language","Theme","Home Page Section Management","SVG Icons"]).includes(state.subtab))state.subtab=name==="Administration"?"User":"Region";renderSubtabs();showSubtab(state.subtab)}}
 async function loadContentRoleOptions(){
  const {data,error}=await supabase.from("roles").select("name").order("name");
  if(error)throw error;
  state.roles=data||[];
  const root=$("content-roles");root.replaceChildren();
  state.roles.forEach(role=>{const label=document.createElement("label");label.className="dashboard__option";const checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.value=role.name;const text=document.createElement("span");text.textContent=role.name;label.append(checkbox,text);root.append(label)});
  setContentRoles(["Owner"]);
 }
 function setContentRoles(names){const selected=new Set(names||[]);$("content-roles").querySelectorAll('input[type="checkbox"]').forEach(input=>input.checked=selected.has(input.value))}
 async function loadAll(){const [{data,error},{data:visibility,error:visibilityError}]=await Promise.all([supabase.from("content").select("id,type,name,slug,skills,label,value,image_url,file_title,location,map,created_at").order("created_at",{ascending:false}),supabase.from("content_visibility").select("content_id,role_name")]);if(error){say(error.message,true);return false}if(visibilityError){say(visibilityError.message,true);return false}state.items=data||[];state.visibility=new Map();(visibility||[]).forEach(row=>{if(!state.visibility.has(row.content_id))state.visibility.set(row.content_id,[]);state.visibility.get(row.content_id).push(row.role_name)});return true}
 function renderContentList(){const root=$("content-list");root.replaceChildren();const filter=$("content-type").value;const list=state.items.filter(x=>filter==="All"||x.type===filter);if(!list.length){const e=document.createElement("p");e.className="dashboard__empty";e.textContent="No existing items";root.append(e);return}list.forEach(item=>{const b=document.createElement("button");b.type="button";b.className="dashboard__item";b.setAttribute("aria-current",String(state.selected===item.id));const info=document.createElement("span");info.className="dashboard__item-info";const name=document.createElement("span");name.className="dashboard__item-name";name.textContent=item.name;info.append(name);const details=[];const visibleRoles=state.visibility.get(item.id)||[];if(visibleRoles.length)details.push("Visibility: "+visibleRoles.join(", "));if(item.type==="Providers"&&item.skills)details.push("Skills: "+item.skills);if(item.type==="Hubs"&&item.location)details.push("Location: "+item.location);if(item.type==="Contacts"&&item.label)details.push("Label: "+item.label);if(item.type==="Videos"&&item.file_title)details.push(item.file_title);if(item.type!=="Contacts"&&item.slug)details.push("Slug: "+item.slug);if(details.length){const meta=document.createElement("small");meta.className="dashboard__item-meta";meta.textContent=details.join(" · ");info.append(meta)}b.append(info);const itemIcon=document.createElement("span");itemIcon.dataset.siteIcon=({Services:"module.services",Products:"module.products",Providers:"module.providers",Hubs:"module.hubs",Contacts:"module.contacts",Images:"module.images",Videos:"module.videos"})[item.type]||"";itemIcon.setAttribute("aria-hidden","true");if(itemIcon.dataset.siteIcon)b.append(itemIcon);if(item.image_url){const thumb=document.createElement("img");thumb.className="dashboard__item-thumb";thumb.alt="";thumb.loading="lazy";thumb.decoding="async";thumb.src=/^https?:\/\//i.test(item.image_url)?item.image_url:supabase.storage.from("site-media").getPublicUrl(item.image_url).data.publicUrl;thumb.addEventListener("error",()=>thumb.remove(),{once:true});b.append(thumb)}b.addEventListener("click",()=>editContent(item));root.append(b)})}
 async function loadContent(){if(await loadAll())renderContentList()}
 function makeField(id,placeholder,type="text"){const wrap=document.createElement("div");wrap.className="dashboard__field";const input=document.createElement("input");input.id=id;input.type=type;input.placeholder=placeholder;input.setAttribute("aria-label",placeholder);input.autocomplete="off";wrap.append(input);return wrap}
 function renderTypeFields(type,item={}){
  const root=$("type-fields");root.replaceChildren();
  const add=(id,label,inputType="text",value="")=>{const wrap=makeField(id,label,inputType),input=wrap.querySelector("input");input.value=value||"";root.append(wrap);return input};
  if(["Services","Products","Providers","Hubs"].includes(type)){
   const slug=add("content-slug","Slug","text",item.slug);slug.maxLength=180;slug.pattern="[a-z0-9]+(-[a-z0-9]+)*";slug.required=true;
   if(type==="Providers")add("content-skills","Skills","text",item.skills);
  if(type==="Hubs"){
   add("content-location","Location","text",item.location);
   const map=add("content-map","Map","url",item.map);map.placeholder="Map URL";
  }
  }
  if(type==="Contacts"){add("content-label","Label","text",item.label);add("content-value","Value","text",item.value)}
  if(type==="Images"||type==="Videos"){
   const fileWrap=document.createElement("div");fileWrap.className="dashboard__field";const label=document.createElement("label");label.htmlFor="content-upload";label.textContent="Upload";const file=document.createElement("input");file.type="file";file.id="content-upload";file.setAttribute("aria-label","Upload");file.accept=type==="Images"?"image/*":"video/*";fileWrap.append(label,file);const hint=document.createElement("small");hint.className="dashboard__hint";hint.textContent="Uploaded files are stored in Supabase Storage.";fileWrap.append(hint);root.append(fileWrap);
   const url=add("content-image-url","Image URL","url",item.image_url);url.placeholder="Upload a file or enter a URL";
   if(type==="Videos"){const title=add("content-file-title","File Title","text",item.file_title);title.readOnly=true;title.placeholder="Set automatically from uploaded file";file.addEventListener("change",()=>{title.value=file.files?.[0]?.name||item.file_title||""})}
  }
 }
 function resetContent(){const type=$("content-form-type").value;state.selected=null;state.slugEdited=false;$("content-form").reset();$("content-form-type").value=type;$("content-name").value="";setContentRoles(["Owner"]);$("content-fields").hidden=!type;renderTypeFields(type);$("content-delete").disabled=true;renderContentList()}
 async function editContent(item){showSubtab("Create Form");state.selected=item.id;state.slugEdited=true;$("content-fields").hidden=false;$("content-name").value=item.name;$("content-type").value=item.type;$("content-form-type").value=item.type;renderTypeFields(item.type,item);$("content-delete").disabled=false;renderContentList();try{await loadContentRoleOptions();const {data,error}=await supabase.from("content_visibility").select("role_name").eq("content_id",item.id);if(error)throw error;setContentRoles((data||[]).map(x=>x.role_name));say("Item loaded")}catch(err){say(err.message,true)}}
 $("content-type").addEventListener("change",()=>{ $("content-form-type").value=$("content-type").value;resetContent()});
 $("content-form-type").addEventListener("change",()=>{state.selected=null;state.slugEdited=false;const hasType=!!$("content-form-type").value;$("content-fields").hidden=!hasType;if(hasType){$("content-name").value="";setContentRoles(["Owner"]);renderTypeFields($("content-form-type").value)}else $("type-fields").replaceChildren();$("content-delete").disabled=true;renderContentList()});
 $("content-name").addEventListener("input",()=>{if(state.slugEdited)return;const slug=$("content-slug");if(slug)slug.value=$("content-name").value.trim().toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").replace(/-{2,}/g,"-")});
 $("type-fields").addEventListener("input",e=>{if(e.target.id==="content-slug")state.slugEdited=true});
 async function uploadSelectedFile(type,slug){
  const file=$("content-upload")?.files?.[0];if(!file)return $("content-image-url")?.value.trim()||null;
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");const safeSlug=(slug||"upload").replace(/[^a-z0-9-]/g,"-");const path=type.toLowerCase()+"/"+safeSlug+"/"+crypto.randomUUID()+"."+ext;
  const {data,error}=await supabase.storage.from("site-media").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type||undefined});
  if(error)throw error;return data.path;
 }
 $("content-form").addEventListener("submit",async e=>{
  e.preventDefault();if(state.busy)return;const type=$("content-form-type").value,name=$("content-name").value.trim();let slug=$("content-slug")?.value.trim().toLowerCase()||name.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").replace(/-{2,}/g,"-");
  if(["Services","Products","Providers","Hubs"].includes(type)&&(!slug||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))){say("Enter a valid slug.",true);return}
  if(!name){say("Enter a name.",true);return}
  setBusy(true);
  try{
   const selectedRoles=[...$("content-roles").querySelectorAll('input[type="checkbox"]:checked')].map(input=>input.value);
   if(!selectedRoles.length)throw new Error("Select at least one Role for visibility.");
   const payload={name,type,updated_at:new Date().toISOString(),slug:type==="Contacts"?null:slug,location:type==="Hubs"?$("content-location").value.trim()||null:null,map:type==="Hubs"?$("content-map").value.trim()||null:null,skills:type==="Providers"?$("content-skills").value.trim()||null:null,label:type==="Contacts"?$("content-label").value.trim()||null:null,value:type==="Contacts"?$("content-value").value:null,image_url:["Images","Videos"].includes(type)?await uploadSelectedFile(type,slug||name.toLowerCase().replace(/[^a-z0-9]+/g,"-")):null,file_title:type==="Videos"?($("content-upload").files[0]?.name||$("content-file-title").value||null):null};
   const wasUpdate=!!state.selected;let contentId=state.selected;
   if(wasUpdate){const {error}=await supabase.from("content").update(payload).eq("id",contentId);if(error)throw error}
   else{const {data,error}=await supabase.from("content").insert(payload).select("id").single();if(error)throw error;contentId=data.id}
   const {error:clearError}=await supabase.from("content_visibility").delete().eq("content_id",contentId);if(clearError)throw clearError;
   const {error:visibilityError}=await supabase.from("content_visibility").insert(selectedRoles.map(role_name=>({content_id:contentId,role_name})));if(visibilityError)throw visibilityError;
   say(wasUpdate?"Updated":"Created");$("content-type").value=type;resetContent();await loadContent();
  }catch(error){say(error.message||"Could not save content.",true)}finally{setBusy(false)}
 });
 $("content-cancel").addEventListener("click",()=>{resetContent();say("")});
 $("content-delete").addEventListener("click",async()=>{if(!state.selected||state.busy||!confirm("Delete this item and its relations?"))return;setBusy(true);const {error}=await supabase.from("content").delete().eq("id",state.selected);if(error)say(error.message,true);else{say("Deleted");resetContent();await loadContent()}setBusy(false)});
 function fillSelect(select,items,placeholder){select.replaceChildren();const p=document.createElement("option");p.value="";p.textContent=placeholder;select.append(p);items.forEach(item=>{const o=document.createElement("option");o.value=item.id;o.textContent=item.name;select.append(o)})}
 async function loadRelationItems(){if(!await loadAll())return;fillSelect($("source-type"),types.map(t=>({id:t,name:t})),"Select type");$("source-type").value=state.sourceType;fillSourceItems()}
 function fillSourceItems(){fillSelect($("source-name"),state.items.filter(x=>x.type===state.sourceType),"Select item");$("source-name").value=state.sourceId;renderTargets()}
 $("source-type").addEventListener("change",()=>{state.sourceType=$("source-type").value;state.sourceId="";state.related.clear();fillSourceItems()});
 $("source-name").addEventListener("change",async()=>{state.sourceId=$("source-name").value;state.related.clear();await renderTargets()});
 async function renderTargets(){const area=$("target-section"),groups=$("target-groups"),existing=$("relation-existing");groups.replaceChildren();existing.replaceChildren();if(!state.sourceId){area.hidden=true;return}area.hidden=false;const {data,error}=await supabase.from("relation").select("source_id,target_id").or("source_id.eq."+state.sourceId+",target_id.eq."+state.sourceId);if(error){say(error.message,true);return}state.related=new Set((data||[]).map(r=>r.source_id===state.sourceId?r.target_id:r.source_id));types.forEach(type=>{const section=document.createElement("section");section.className="dashboard__relation-group";const h=document.createElement("h3");h.textContent=type;const options=document.createElement("div");options.className="dashboard__relation-options";const candidates=state.items.filter(x=>x.type===type&&x.id!==state.sourceId);if(!candidates.length){const empty=document.createElement("small");empty.textContent="No existing items";options.append(empty)}candidates.forEach(item=>{const label=document.createElement("label");label.className="dashboard__option";const cb=document.createElement("input");cb.type="checkbox";cb.checked=state.related.has(item.id);cb.value=item.id;cb.addEventListener("change",()=>{if(cb.checked)state.related.add(item.id);else state.related.delete(item.id);renderExistingRelations()});const span=document.createElement("span");span.textContent=item.name;label.append(cb,span);options.append(label)});section.append(h,options);groups.append(section)});renderExistingRelations()}
 function renderExistingRelations(){const root=$("relation-existing");root.replaceChildren();const names=state.items.filter(x=>state.related.has(x.id));if(!names.length){const p=document.createElement("p");p.className="dashboard__empty";p.textContent="No selected relations";root.append(p);return}names.forEach(x=>{const p=document.createElement("p");p.textContent=x.type+" — "+x.name;root.append(p)})}
 $("relation-save").addEventListener("click",async()=>{if(!state.sourceId||state.busy){say("Select a source item first.",true);return}setBusy(true);const source=state.sourceId;const {data:oldRows,error:readError}=await supabase.from("relation").select("id,source_id,target_id").or("source_id.eq."+source+",target_id.eq."+source);if(readError){say(readError.message,true);setBusy(false);return}const oldMap=new Map((oldRows||[]).map(r=>[r.source_id===source?r.target_id:r.source_id,r.id]));const remove=[...oldMap].filter(([id])=>!state.related.has(id)).map(([,id])=>id);const add=[...state.related].filter(id=>!oldMap.has(id)).map(id=>({source_id:source,target_id:id}));let failure=null;if(remove.length){const {error}=await supabase.from("relation").delete().in("id",remove);failure=error}if(!failure&&add.length){const {error}=await supabase.from("relation").insert(add);failure=error}say(failure?failure.message:"Relations saved",!!failure);setBusy(false);if(!failure)await renderTargets()});

 window.addEventListener("3b:global-update",()=>{
  if(state.tab==="Content"){
   if(state.subtab==="Relation Form"&&!$("target-section").hidden)return;
   if(state.subtab==="Existed List"||state.subtab==="Create Form")loadContent().catch(err=>say(err.message,true));
   else if(state.subtab==="Relation Form")loadRelationItems().catch(err=>say(err.message,true));
   return;
  }
  const group=state.tab==="Administration"?"admin":"settings";
  const panel=[...document.querySelectorAll("[data-subtab-panel]")].find(p=>p.dataset.group===group&&p.dataset.subtab===state.subtab);
  if(!panel||panel.hidden)return;
  const form=panel.querySelector("form");
  if(form&&!form.hidden)return;
  panel.__globalRefresh?.().catch(err=>say(err.message,true));
 });

 $("content-form-type").value="";$("content-fields").hidden=true;loadContentRoleOptions().then(()=>loadContent()).then(()=>showTab("Content")).catch(err=>say(err.message,true));
}
</script>
</head>
<body>
<main class="container dashboard">
<nav class="dashboard__tabs" id="dashboard-tabs" aria-label="Dashboard sections"></nav>
<section id="content-panel" hidden>
<nav id="content-subtabs" class="dashboard__subtabs" aria-label="Content sections"></nav>
<div id="existed-list-panel" class="dashboard__panel"><h2>Existed List</h2><div class="dashboard__field"><label for="content-type">Type</label><select id="content-type"><option value="All">All</option><option>Services</option><option>Products</option><option>Providers</option><option>Hubs</option><option>Contacts</option><option>Images</option><option>Videos</option></select></div><div class="dashboard__list" id="content-list"></div></div>
<section id="create-form-panel" class="dashboard__panel"><h2>Create Form</h2>
<form id="content-form">
<div class="dashboard__field"><select id="content-form-type" required><option value="">Select type</option><option>Services</option><option>Products</option><option>Providers</option><option>Hubs</option><option>Contacts</option><option>Images</option><option>Videos</option></select></div>
<div id="content-fields" hidden>
<div class="dashboard__field"><span data-site-icon="field.name" aria-hidden="true"></span><input id="content-name" placeholder="Name" aria-label="Name" maxlength="160" required autocomplete="off"></div>
<div id="type-fields"></div>
<div class="dashboard__field"><label>Visibility — Roles</label><div id="content-roles" class="dashboard__role-options"></div><small class="dashboard__hint">Select one or more existing Roles.</small></div>
<div class="dashboard__actions"><button class="button button--primary" id="content-save" type="submit" data-site-icon="action.save">Save</button><button class="button button--secondary" id="content-cancel" type="button" data-site-icon="action.cancel">Cancel</button><button class="button button--secondary" id="content-delete" type="button" data-site-icon="action.delete" disabled>Delete</button></div>
</div></form></section>
<section id="relation-form-panel" class="dashboard__panel" hidden><h2>Relation Form</h2>
<div class="dashboard__field"><select id="source-type" aria-label="Select type"><option value="">Select type</option></select></div>
<div class="dashboard__field"><select id="source-name" aria-label="Select item"><option value="">Select item</option></select></div>
<div id="target-section" hidden><h2>Target Section</h2><div class="dashboard__relation-groups" id="target-groups"></div><h2>Existed Item List</h2><div id="relation-existing"></div><div class="dashboard__actions"><button class="button button--primary" id="relation-save" type="button" data-site-icon="action.save">Save Relations</button></div></div>
</section></section>
<section id="administration-panel" hidden><nav id="administration-subtabs" class="dashboard__subtabs" aria-label="Administration sections"></nav>
<section class="dashboard__panel" data-subtab-panel data-group="admin" data-subtab="User"><h2>User</h2></section>
<section class="dashboard__panel" data-subtab-panel data-group="admin" data-subtab="Role" hidden><h2>Role</h2></section>
<section class="dashboard__panel" data-subtab-panel data-group="admin" data-subtab="Permission" hidden><h2>Permission</h2></section>
</section>
<section id="settings-panel" hidden><nav id="settings-subtabs" class="dashboard__subtabs" aria-label="Settings sections"></nav>
<section class="dashboard__panel" data-subtab-panel data-group="settings" data-subtab="Region"><h2>Region</h2></section>
<section class="dashboard__panel" data-subtab-panel data-group="settings" data-subtab="Direction" hidden><h2>Direction</h2></section>
<section class="dashboard__panel" data-subtab-panel data-group="settings" data-subtab="Language" hidden><h2>Language</h2></section>
<section class="dashboard__panel" data-subtab-panel data-group="settings" data-subtab="Theme" hidden><h2>Theme</h2></section>
<section class="dashboard__panel" data-subtab-panel data-group="settings" data-subtab="Home Page Section Management" hidden><h2>Home Page Section Management</h2></section>
<section class="dashboard__panel" data-subtab-panel data-group="settings" data-subtab="SVG Icons" hidden><h2>SVG Icons</h2></section>
</section>
<p class="dashboard__status" id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
