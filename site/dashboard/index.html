<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>3B TECH HUB</title></head>
<body><main>Loading 3B TECH HUB…</main>
<script>
(async()=>{try{
 const response=await fetch('./index/index.html');
 if(!response.ok)throw new Error('Page entry could not be loaded ('+response.status+').');
 const html=await response.text();
 const page=html.replace(/<head([^>]*)>/i,'<head$1><base href="./">');
 document.open();document.write(page);document.close();
}catch(error){document.body.textContent='Unable to load this page. Please refresh and try again.';console.error(error)}})();
</script></body></html>
