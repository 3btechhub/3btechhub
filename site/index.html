<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff">
<title>3B TECH HUB</title>
<style>
:root{color-scheme:light;--white:#fff;--black:#111;--gray-50:#fafafa;--gray-100:#f2f2f2;--gray-200:#e5e5e5;--gray-500:#777;--gray-700:#444;--radius:26px;--control:16px;--shadow:0 14px 38px #11111112;--float:0 12px 30px #1113;--heading:clamp(1.55rem,5vw,2rem);font:16px Arial,sans-serif;background:#fff;color:#111}
*{box-sizing:border-box}body{margin:0;min-width:280px;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#eee,transparent 48%),#fff}
main{width:100%;min-height:100vh;padding:28px 16px 110px}.site-title{margin:0 auto 30px;text-align:center;font-size:var(--heading);line-height:1.25}.page{display:none}.page.is-active{display:block}.page-title{text-align:center;margin:0;font-size:var(--heading)}
.content{width:100%;max-width:760px;margin:26px auto 0}.module{margin:16px 0;padding:22px;overflow:hidden;border:1px solid #fff;border-radius:var(--radius);background:radial-gradient(ellipse at 16% 0%,#fff,transparent 58%),radial-gradient(ellipse at 100% 100%,#ddd5,transparent 54%),linear-gradient(145deg,#fff 8%,#f7f7f7 58%,#ededed);box-shadow:var(--shadow),inset 0 1px #fff}.module h2{margin:0 0 18px;font-size:var(--heading)}.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.item{padding:17px;border:1px solid #fff;border-radius:20px;background:linear-gradient(145deg,#fff,#f1f1f1);box-shadow:0 8px 22px #11110a}.item h3{margin:0 0 8px;font-size:1.05rem}.muted{color:var(--gray-500);line-height:1.5}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:.9rem;color:var(--gray-700)}input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--gray-200);border-radius:var(--control);background:#ffffffdd;color:var(--black);font:inherit;outline:none;box-shadow:inset 0 1px 3px #00000008}input:focus{border-color:var(--gray-500);box-shadow:0 0 0 3px #0000000f}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}button{min-height:44px;padding:10px 16px;border:1px solid var(--gray-200);border-radius:999px;background:#fff;color:#111;font:inherit;cursor:pointer}button.primary{background:#111;color:#fff;border-color:#111}button.danger{color:#a11;border-color:#e7caca}button:disabled{opacity:.5;cursor:not-allowed}.visibility{display:flex;align-items:center;gap:10px;min-height:48px}.visibility input{width:18px;min-height:18px;box-shadow:none}.records{margin-top:22px;padding-top:18px;border-top:1px solid var(--gray-200)}.record{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--gray-200)}.record:last-child{border-bottom:0}.record strong{display:block}.record small{color:var(--gray-500)}.empty{padding:16px;border:1px solid #fff;border-radius:18px;background:linear-gradient(145deg,#fff,#f1f1f1);color:var(--gray-500);line-height:1.5}.notice{margin:12px 0 0;color:var(--gray-500);font-size:.92rem;line-height:1.5}.status{min-height:22px;margin-top:12px;color:var(--gray-700);font-size:.92rem}.tabs{display:flex;flex-wrap:nowrap;gap:8px;margin:20px 0;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:thin;padding-bottom:4px}.tabs button{flex:0 0 auto;white-space:nowrap}.tabs button[aria-pressed=true]{background:#111;color:#fff;border-color:#111}.menu-panel{position:fixed;right:20px;bottom:88px;z-index:9;display:grid;min-width:180px;gap:4px;padding:8px;border:1px solid #fff;border-radius:24px;background:radial-gradient(ellipse at 18% 0%,#fff,transparent 58%),linear-gradient(145deg,#fffffffA,#f2f2f2f5);box-shadow:var(--shadow),inset 0 1px #fff;backdrop-filter:blur(16px)}.menu-panel[hidden]{display:none}.menu-link{display:block;padding:12px 14px;border-radius:14px;color:inherit;text-decoration:none}.menu-link:hover,.menu-link:focus-visible,.menu-link[aria-current=page]{background:var(--gray-100);outline:none}.menu-toggle{position:fixed;right:20px;bottom:20px;z-index:10;display:grid;width:58px;height:58px;place-items:center;padding:0;border:1px solid #ffffff77;border-radius:999px;background:radial-gradient(ellipse at 28% 10%,#ffffff5c,transparent 44%),linear-gradient(145deg,#333,#111 72%);color:#fff;box-shadow:var(--float),inset 0 1px 1px #ffffff47,inset 0 -2px 4px #0005;-webkit-tap-highlight-color:transparent}.menu-toggle svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.close-icon{display:none}.menu-toggle[aria-expanded=true] .menu-icon{display:none}.menu-toggle[aria-expanded=true] .close-icon{display:block}.skeleton{height:76px;margin:12px 0;border-radius:18px;background:linear-gradient(90deg,#eee 25%,#f8f8f8 38%,#eee 62%);background-size:400% 100%;animation:shine 1.3s ease infinite}@keyframes shine{0%{background-position:100% 0}100%{background-position:0 0}}
@media(max-width:480px){main{padding-top:22px}.module{padding:18px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.record{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<h1 class="site-title" id="site-title">3B TECH HUB</h1>
<section class="page is-active" id="home" aria-label="Home"><div class="content" id="home-content"><div class="skeleton"></div><div class="skeleton"></div></div></section>
<section class="page" id="account" aria-labelledby="account-title">
<h2 class="page-title" id="account-title">Account</h2>
<div class="content"><section class="module" id="login-panel"><h2>Login</h2><form id="login-form"><div class="form-grid"><div class="field full"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required></div><div class="field full"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div></div><div class="actions"><button class="primary" type="submit">Login</button></div></form><p class="status" id="account-status" role="status"></p></section><section class="module" id="profile-panel" hidden><h2>Account</h2><div class="field"><label>Name</label><p id="account-user-name" class="muted"></p></div><div class="field"><label>Email</label><p id="account-user-email" class="muted"></p></div><div class="actions"><button type="button" id="logout-button">Logout</button></div></section></div>
</section>
<section class="page" id="dashboard" aria-labelledby="dashboard-title">
<h2 class="page-title" id="dashboard-title">Dashboard</h2>
<div class="content"><div class="tabs" aria-label="Dashboard modules"><button type="button" data-tab="services" aria-pressed="true">Service</button><button type="button" data-tab="products" aria-pressed="false">Product</button><button type="button" data-tab="relations" aria-pressed="false">Relation</button><button type="button" data-tab="settings" aria-pressed="false">Setting</button></div>
<section class="module" id="services-panel"><h2>Service</h2><form id="service-form"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label for="service-name">Name</label><input id="service-name" name="name" required maxlength="160"></div><div class="field"><label for="service-slug">Slug</label><input id="service-slug" name="slug" required maxlength="180"></div><div class="field"><label>Visibility</label><div class="visibility"><input id="service-visible" name="is_visible" type="checkbox" checked><span id="service-visible-label">Show</span></div></div></div><div class="actions"><button class="primary" type="submit">Save</button><button type="button" data-cancel="service">Cancel</button><button type="button" class="danger" id="service-delete" hidden>Delete</button></div></form><div class="records"><h3>Existing Information</h3><div id="service-records"><div class="skeleton"></div></div></div></section>
<section class="module" id="products-panel" hidden><h2>Product</h2><form id="product-form"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label for="product-name">Name</label><input id="product-name" name="name" required maxlength="160"></div><div class="field"><label for="product-slug">Slug</label><input id="product-slug" name="slug" required maxlength="180"></div><div class="field"><label>Visibility</label><div class="visibility"><input id="product-visible" name="is_visible" type="checkbox" checked><span id="product-visible-label">Show</span></div></div></div><div class="actions"><button class="primary" type="submit">Save</button><button type="button" data-cancel="product">Cancel</button><button type="button" class="danger" id="product-delete" hidden>Delete</button></div></form><div class="records"><h3>Existing Information</h3><div id="product-records"><div class="skeleton"></div></div></div></section>
<section class="module" id="relations-panel" hidden><h2>Relation</h2><form id="relation-form"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label for="relation-name">Name</label><input id="relation-name" name="name" required maxlength="160"></div><div class="field"><label for="relation-slug">Slug</label><input id="relation-slug" name="slug" required maxlength="180"></div><div class="field"><label>Visibility</label><div class="visibility"><input id="relation-visible" name="is_visible" type="checkbox" checked><span id="relation-visible-label">Show</span></div></div><div class="field full"><label>Service</label><div id="relation-service-options" class="muted">Loading services…</div></div><div class="field full"><label>Product</label><div id="relation-product-options" class="muted">Loading products…</div></div></div><div class="actions"><button class="primary" type="submit">Save</button><button type="button" data-cancel="relation">Cancel</button><button type="button" class="danger" id="relation-delete" hidden>Delete</button></div></form><div class="records"><h3>Existing Information</h3><div id="relation-records"><div class="skeleton"></div></div></div></section>
<section class="module" id="settings-panel" hidden><h2>Setting</h2><form id="settings-form"><div class="field"><label for="website-title-input">Website Title</label><input id="website-title-input" name="website_title" required maxlength="120"></div><div class="actions"><button class="primary" type="submit">Save</button></div></form><p class="status" id="settings-status" role="status"></p></section>
<p class="status" id="dashboard-status" role="status"></p></div>
</section>
</main>
<nav class="menu-panel" id="navigation" aria-label="Main navigation" hidden><a class="menu-link" href="#home" aria-current="page">Home</a><a class="menu-link" href="#account">Account</a><a class="menu-link" href="#dashboard">Dashboard</a></nav>
<button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navigation"><svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';
const supabase=createClient('https://sburxeuxkrilbfppxylm.supabase.co','sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT');
const $=s=>document.querySelector(s);
const menuToggle=$('.menu-toggle'),navigation=$('#navigation'),pages=[...document.querySelectorAll('.page')],links=[...document.querySelectorAll('.menu-link')];
let currentUser=null,currentRole=null,pendingRoute=null,services=[],products=[],relations=[];
const slugify=value=>value.normalize('NFKD').toLowerCase().trim().replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function bindSlug(nameId,slugId){const name=$(nameId),slug=$(slugId);let manual=false;slug.addEventListener('input',()=>manual=true);name.addEventListener('input',()=>{if(!manual)slug.value=slugify(name.value)});return()=>{manual=false}}
const resetServiceSlug=bindSlug('#service-name','#service-slug'),resetProductSlug=bindSlug('#product-name','#product-slug'),resetRelationSlug=bindSlug('#relation-name','#relation-slug');
function setMenu(open){menuToggle.setAttribute('aria-expanded',String(open));menuToggle.setAttribute('aria-label',open?'Close menu':'Open menu');navigation.hidden=!open}
function updateAccountView(){const signedIn=!!currentUser;$('#login-panel').hidden=signedIn;$('#profile-panel').hidden=!signedIn;if(signedIn){$('#account-user-name').textContent=currentUser.user_metadata?.full_name||currentUser.user_metadata?.name||currentUser.email||'—';$('#account-user-email').textContent=currentUser.email||'—'}}
function route(){let id=location.hash.slice(1)||'home';if(!['home','account','dashboard'].includes(id))id='home';if(id==='account'&&!currentUser)pendingRoute='account';if(id==='dashboard'&&!currentUser){pendingRoute='dashboard';id='account'}else if(id==='dashboard'&&!['Admin','Owner'].includes(currentRole))id='account';pages.forEach(p=>p.classList.toggle('is-active',p.id===id));links.forEach(a=>a.hash==='#'+id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));if(location.hash!=='#'+id&&id!=='home')history.replaceState(null,'','#'+id);setMenu(false);if(id==='account')updateAccountView();if(id==='home')renderHome();if(id==='dashboard')loadDashboard()}
menuToggle.addEventListener('click',()=>setMenu(menuToggle.getAttribute('aria-expanded')!=='true'));links.forEach(a=>a.addEventListener('click',()=>setMenu(false)));window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
async function loadRole(){if(!currentUser){currentRole=null;return}const{data,error}=await supabase.from('user_roles').select('role').eq('user_id',currentUser.id).maybeSingle();currentRole=error?null:data?.role||null}
async function renderHome(){const root=$('#home-content');root.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';const [s,p,settings]=await Promise.all([supabase.from('services').select('id,name,slug').eq('is_visible',true).order('name'),supabase.from('products').select('id,name,slug').eq('is_visible',true).order('name'),supabase.from('site_settings').select('website_title').eq('id',true).maybeSingle()]);if(settings.data?.website_title){$('#site-title').textContent=settings.data.website_title;document.title=settings.data.website_title}root.replaceChildren();for(const [label,result] of [['Service',s],['Product',p]]){const section=document.createElement('section');section.className='module';const heading=document.createElement('h2');heading.textContent=label;section.append(heading);const grid=document.createElement('div');grid.className='module-grid';if(result.error){grid.innerHTML='<p class="empty">Information could not be loaded.</p>'}else if(!result.data?.length){grid.innerHTML='<p class="empty">No information available yet.</p>'}else result.data.forEach(item=>{const card=document.createElement('article');card.className='item';const h=document.createElement('h3');h.textContent=item.name;card.append(h);grid.append(card)});section.append(grid);root.append(section)}}
function setStatus(id,message){$(id).textContent=message}
function renderRecords(type,rows){const target=$('#'+type+'-records');target.replaceChildren();if(!rows.length){target.innerHTML='<p class="empty">No existing information.</p>';return}rows.forEach(row=>{const item=document.createElement('div');item.className='record';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=row.name;const meta=document.createElement('small');meta.textContent=row.slug+' · '+(row.is_visible?'Visible':'Hidden');info.append(name,meta);const edit=document.createElement('button');edit.type='button';edit.textContent='Edit';edit.addEventListener('click',()=>editRecord(type,row));item.append(info,edit);target.append(item)})}
async function loadDashboard(){setStatus('#dashboard-status','Loading…');const [s,p,r,settings]=await Promise.all([supabase.from('services').select('*').order('name'),supabase.from('products').select('*').order('name'),supabase.from('relations').select('*, relation_services(service_id), relation_products(product_id)').order('name'),supabase.from('site_settings').select('website_title').eq('id',true).maybeSingle()]);if(s.error||p.error||r.error||settings.error){setStatus('#dashboard-status','Unable to load dashboard data. Check your account permissions.');return}services=s.data||[];products=p.data||[];relations=r.data||[];$('#website-title-input').value=settings.data?.website_title||'3B TECH HUB';renderRecords('service',services);renderRecords('product',products);renderRecords('relation',relations);renderRelationOptions();setStatus('#dashboard-status','')}
function editRecord(type,row){const form=$('#'+type+'-form');form.elements.id.value=row.id;form.elements.name.value=row.name;form.elements.slug.value=row.slug;form.elements.is_visible.checked=row.is_visible;$('#'+type+'-visible-label').textContent=row.is_visible?'Show':'Hide';$('#'+type+'-delete').hidden=false;form.querySelector('button[type=submit]').textContent='Update';if(type==='relation'){const serviceIds=(row.relation_services||[]).map(x=>x.service_id),productIds=(row.relation_products||[]).map(x=>x.product_id);document.querySelectorAll('[name=relation_service]').forEach(x=>x.checked=serviceIds.includes(x.value));document.querySelectorAll('[name=relation_product]').forEach(x=>x.checked=productIds.includes(x.value))}}
function resetForm(type){const form=$('#'+type+'-form');form.reset();form.elements.id.value='';form.elements.is_visible.checked=true;$('#'+type+'-visible-label').textContent='Show';$('#'+type+'-delete').hidden=true;form.querySelector('button[type=submit]').textContent='Save';if(type==='service')resetServiceSlug();else if(type==='product')resetProductSlug();else if(type==='relation'){resetRelationSlug();document.querySelectorAll('[name=relation_service],[name=relation_product]').forEach(x=>x.checked=false)}}
for(const type of ['service','product']){const form=$('#'+type+'-form');form.elements.is_visible.addEventListener('change',e=>$('#'+type+'-visible-label').textContent=e.target.checked?'Show':'Hide');form.addEventListener('submit',async e=>{e.preventDefault();const id=form.elements.id.value;const row={name:form.elements.name.value.trim(),slug:slugify(form.elements.slug.value),is_visible:form.elements.is_visible.checked};const button=form.querySelector('button[type=submit]');button.disabled=true;const result=id?await supabase.from(type==='service'?'services':'products').update(row).eq('id',id):await supabase.from(type==='service'?'services':'products').insert(row);button.disabled=false;if(result.error){setStatus('#dashboard-status',result.error.message);return}resetForm(type);await loadDashboard()});$('#'+type+'-delete').addEventListener('click',async()=>{const id=form.elements.id.value;if(!id)return;const result=await supabase.from(type==='service'?'services':'products').delete().eq('id',id);if(result.error){setStatus('#dashboard-status',result.error.message);return}resetForm(type);await loadDashboard()})}
function renderRelationOptions(){for(const [kind,rows] of [['service',services],['product',products]]){const root=$('#relation-'+kind+'-options');root.replaceChildren();if(!rows.length){root.textContent='No '+kind+' items available.';continue}rows.forEach(row=>{const label=document.createElement('label');label.className='visibility';const input=document.createElement('input');input.type='checkbox';input.name='relation_'+kind;input.value=row.id;const text=document.createElement('span');text.textContent=row.name;label.append(input,text);root.append(label)})}}
$('#relation-form').elements.is_visible.addEventListener('change',e=>$('#relation-visible-label').textContent=e.target.checked?'Show':'Hide');
$('#relation-form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,id=form.elements.id.value;const row={name:form.elements.name.value.trim(),slug:slugify(form.elements.slug.value),is_visible:form.elements.is_visible.checked,updated_at:new Date().toISOString()};const saved=id?await supabase.from('relations').update(row).eq('id',id).select('id').single():await supabase.from('relations').insert(row).select('id').single();if(saved.error){setStatus('#dashboard-status',saved.error.message);return}const relationId=saved.data.id;for(const [table,field] of [['relation_services','relation_service'],['relation_products','relation_product']]){const removed=await supabase.from(table).delete().eq('relation_id',relationId);if(removed.error){setStatus('#dashboard-status',removed.error.message);return}const ids=[...document.querySelectorAll('[name='+field+']:checked')].map(x=>x.value);if(ids.length){const inserted=await supabase.from(table).insert(ids.map(itemId=>({relation_id:relationId,[field==='relation_service'?'service_id':'product_id']:itemId})));if(inserted.error){setStatus('#dashboard-status',inserted.error.message);return}}}resetForm('relation');await loadDashboard()});
$('#relation-delete').addEventListener('click',async()=>{const id=$('#relation-form').elements.id.value;if(!id)return;const{error}=await supabase.from('relations').delete().eq('id',id);if(error){setStatus('#dashboard-status',error.message);return}resetForm('relation');await loadDashboard()});
document.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>resetForm(b.dataset.cancel)));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#services-panel').hidden=b.dataset.tab!=='services';$('#products-panel').hidden=b.dataset.tab!=='products';$('#relations-panel').hidden=b.dataset.tab!=='relations';$('#settings-panel').hidden=b.dataset.tab!=='settings'}));
$('#settings-form').addEventListener('submit',async e=>{e.preventDefault();const title=$('#website-title-input').value.trim();const{error}=await supabase.from('site_settings').update({website_title:title,updated_at:new Date().toISOString()}).eq('id',true);setStatus('#settings-status',error?error.message:'Saved.');if(!error){$('#site-title').textContent=title;document.title=title}});
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const{data,error}=await supabase.auth.signInWithPassword({email:$('#login-email').value.trim(),password:$('#login-password').value});if(error){setStatus('#account-status',error.message);return}currentUser=data.user;await loadRole();const target=pendingRoute;pendingRoute=null;location.hash=target==='dashboard'&&['Admin','Owner'].includes(currentRole)?'#dashboard':'#account';route()});
$('#logout-button').addEventListener('click',async()=>{await supabase.auth.signOut();currentUser=null;currentRole=null;pendingRoute=null;location.hash='#home';route()});
supabase.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;await loadRole();$('#logout-button').hidden=!currentUser;route()});
const{data:{session}}=await supabase.auth.getSession();currentUser=session?.user||null;await loadRole();$('#logout-button').hidden=!currentUser;route();
</script>
</body>
</html>
