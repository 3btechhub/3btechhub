<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../global.css">
<script src="../navigation.js" defer></script>
<title>Content · 3B TECH HUB</title>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.1";
import {connectGlobalRealtime} from "../realtime.js";
import {initSiteIcons} from "../icons.js";
const supabase=createClient("https://sburxeuxkrilbfppxylm.supabase.co","sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT");
connectGlobalRealtime(supabase);initSiteIcons(supabase);
const root=document.getElementById("content-root"),status=document.getElementById("content-status");
const params=new URLSearchParams(location.search),type=params.get("type"),id=params.get("id");
const fieldOptions={Services:[],Products:[],Providers:[["skills","Skills"]],Hubs:[["location","Location"],["map","View Location"]],Contacts:[["label","Label"],["value","Value"]],Images:[["image_url","Image"]],Videos:[["file_title","File Title"],["image_url","Open Video"]]};
const defaultFieldOrder=type=>(fieldOptions[type]||[]).map(([key])=>key);
const typeIcon={Services:"module.services",Products:"module.products",Providers:"module.providers",Hubs:"module.hubs",Contacts:"module.contacts",Images:"module.images",Videos:"module.videos"};
const publicImageUrl=path=>{if(!path)return "";if(/^https?:\/\//i.test(path))return path;return supabase.storage.from("site-media").getPublicUrl(path).data.publicUrl};
function element(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function itemLink(item){const a=element("a","content__item",item.name||"");a.href="?type="+encodeURIComponent(item.type)+"&id="+encodeURIComponent(item.id);return a}
function renderDetail(item,configuredOrder,relatedItems=[]){
 const wrap=element("article","content__detail");
 const icon=element("span","content__detail-icon");icon.dataset.siteIcon=typeIcon[item.type]||"module.services";icon.setAttribute("aria-hidden","true");wrap.append(icon);
 wrap.append(element("h1","content__title",item.name||""));
 const available=fieldOptions[item.type]||[],saved=Array.isArray(configuredOrder)?configuredOrder:defaultFieldOrder(item.type);
 const order=[...saved.filter(key=>available.some(([field])=>field===key)),...available.map(([key])=>key).filter(key=>!saved.includes(key))];
 order.forEach(key=>{
  const label=available.find(([field])=>field===key)?.[1]||key;
  if(key==="image_url"&&item.type==="Images"&&item.image_url){const img=element("img","content__image");img.src=publicImageUrl(item.image_url);img.alt=item.name||"";img.loading="lazy";wrap.append(img);return}
  if(key==="image_url"&&item.type==="Videos"&&item.image_url){const a=element("a","content__external","Open Video");a.href=publicImageUrl(item.image_url);a.target="_blank";a.rel="noopener noreferrer";wrap.append(a);return}
  if(key==="map"&&item.map){const a=element("a","content__external",label);a.href=item.map;a.target="_blank";a.rel="noopener noreferrer";wrap.append(a);return}
  if(item[key]){const p=element("p","content__field");p.append(element("strong","",label+": "),document.createTextNode(item[key]));wrap.append(p)}
 });
 const relatedHeading=element("h2","content__related-title","Related Information");wrap.append(relatedHeading);
 if(!relatedItems.length){wrap.append(element("p","content__empty","No related information"))}
 else{const group=element("div","content__related-list");relatedItems.forEach(related=>{const a=element("a","content__related-item");a.href="?type="+encodeURIComponent(related.type)+"&id="+encodeURIComponent(related.id);a.append(element("small","",related.type),element("strong","",related.name||""));group.append(a)});wrap.append(group)}
 const back=element("a","content__back","Back to "+item.type);back.href="?type="+encodeURIComponent(item.type);wrap.append(back);root.append(wrap);
 document.title=(item.name||"Details")+" · 3B TECH HUB";window.siteIcons?.apply();
}
async function render(){
 try{
  if(!type){status.textContent="Content type not specified.";return}
  if(id){
   const [{data,error},{data:orderData,error:orderError}]=await Promise.all([
    supabase.from("content").select("id,type,name,slug,skills,label,value,image_url,file_title,location,map").eq("id",id).eq("type",type).maybeSingle(),
    supabase.from("content_type_field_orders").select("field_order").eq("content_type",type).maybeSingle()
   ]);
   if(error)throw error;if(orderError)throw orderError;if(!data){status.textContent="Item not found.";return}
   const {data:relations,error:relationError}=await supabase.from("relation").select("source_id,target_id").or("source_id.eq."+id+",target_id.eq."+id);
   if(relationError)throw relationError;
   const relatedIds=(relations||[]).map(r=>r.source_id===id?r.target_id:r.source_id);
   let relatedItems=[];
   if(relatedIds.length){const {data:relatedData,error:relatedError}=await supabase.from("content").select("id,type,name").in("id",relatedIds).order("type").order("name");if(relatedError)throw relatedError;relatedItems=relatedData||[]}
   renderDetail(data,orderData?.field_order,relatedItems);return;
  }
  const {data,error}=await supabase.from("content").select("id,type,name").eq("type",type).order("created_at",{ascending:false});
  if(error)throw error;
  root.append(element("h1","content__title",type));
  if(!data?.length){root.append(element("p","content__empty","No items found."));return}
  const list=element("div","content__list");data.forEach(item=>list.append(itemLink(item)));root.append(list);
 }catch(error){status.textContent=error.message||"Unable to load content."}
}
render();
window.addEventListener("3b:global-update",()=>{root.replaceChildren();render()});
</script>
</head>
<body>
<main class="container content-page">
<div id="content-root"></div>
<p id="content-status" class="home__status" role="status" aria-live="polite"></p>
<a class="content__home" href="../home/">Home</a>
</main>
</body>
</html>
