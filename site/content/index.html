<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../global.css">
<script src="../navigation.js" defer></script>
<title>3B TECH HUB</title>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.1";
import {connectGlobalRealtime} from "../realtime.js";
import {initSiteIcons} from "../icons.js";
const supabase=createClient("https://sburxeuxkrilbfppxylm.supabase.co","sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT");
connectGlobalRealtime(supabase);initSiteIcons(supabase);
const root=document.getElementById("content-root"),status=document.getElementById("content-status");
const params=new URLSearchParams(location.search),moduleName=params.get("module"),id=params.get("id");
const fieldOptions={Services:[],Products:[],Technician:[["skills","Skills"]],Workshop:[["location","Location"],["map","View Location"]],Gallery:[],Contacts:[["label","Label"],["value","Value"]],Location:[],Images:[["image_url","Image"]],Videos:[["file_title","File Title"],["image_url","Open Video"]]};
const iconFor={Services:"module.services",Products:"module.products",Technician:"module.technician",Workshop:"module.workshop",Gallery:"module.gallery",Contacts:"module.contacts",Location:"field.location",Images:"module.images",Videos:"module.videos"};
const defaultFieldOrder=module=>(fieldOptions[module]||[]).map(([key])=>key);
const publicImageUrl=path=>!path?"":/^https?:\/\//i.test(path)?path:supabase.storage.from("site-media").getPublicUrl(path).data.publicUrl;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function itemLink(item){const a=el("a","content__item",item.name||"");a.href="?module="+encodeURIComponent(item.module)+"&id="+encodeURIComponent(item.id);return a}
function renderDetail(item,configuredOrder,relatedItems=[]){
 const wrap=el("article","content__detail"),icon=el("span","content__detail-icon");icon.dataset.siteIcon=iconFor[item.module]||"module.services";icon.setAttribute("aria-hidden","true");wrap.append(icon,el("h1","content__title",item.name||""));
 const available=fieldOptions[item.module]||[],saved=Array.isArray(configuredOrder)?configuredOrder:defaultFieldOrder(item.module);
 const order=[...saved.filter(k=>available.some(([f])=>f===k)),...available.map(([k])=>k).filter(k=>!saved.includes(k))];
 order.forEach(key=>{
  const label=available.find(([f])=>f===key)?.[1]||key;
  if(key==="image_url"&&item.module==="Images"&&item.image_url){const img=el("img","content__image");img.src=publicImageUrl(item.image_url);img.alt=item.name||"";img.loading="lazy";wrap.append(img);return}
  if(key==="image_url"&&item.module==="Videos"&&item.image_url){const a=el("a","content__external","Open Video");a.href=publicImageUrl(item.image_url);a.target="_blank";a.rel="noopener noreferrer";wrap.append(a);return}
  if(key==="map"&&item.map){const a=el("a","content__external",label);a.href=item.map;a.target="_blank";a.rel="noopener noreferrer";wrap.append(a);return}
  if(item[key]){const p=el("p","content__field");p.append(el("strong","",label+": "),document.createTextNode(item[key]));wrap.append(p)}
 });
 const heading=el("h2","content__related-title","Related Information");wrap.append(heading);
 if(!relatedItems.length)wrap.append(el("p","content__empty","No related information"));
 else{const group=el("div","content__related-list");relatedItems.forEach(x=>{const a=el("a","content__related-item");a.href="?module="+encodeURIComponent(x.module)+"&id="+encodeURIComponent(x.id);a.append(el("small","",x.module),el("strong","",x.name||""));group.append(a)});wrap.append(group)}
 const back=el("a","content__back","Back to "+item.module);back.href="?module="+encodeURIComponent(item.module);wrap.append(back);root.append(wrap);document.title=(item.name||"Details")+" · 3B TECH HUB";window.siteIcons?.apply();
}
async function render(){
 try{
  if(!moduleName){status.textContent="Module not specified.";return}
  if(id){
   const [{data,error},{data:orderData,error:orderError}]=await Promise.all([
    supabase.from("content").select("id,module,name,slug,skills,label,value,image_url,file_title,location,map").eq("id",id).eq("module",moduleName).maybeSingle(),
    supabase.from("module_field_orders").select("field_order").eq("module",moduleName).maybeSingle()
   ]);
   if(error)throw error;if(orderError)throw orderError;if(!data){status.textContent="Item not found.";return}
   const {data:relations,error:relationError}=await supabase.from("relation").select("source_id,target_id").or("source_id.eq."+id+",target_id.eq."+id);if(relationError)throw relationError;
   const relatedIds=(relations||[]).map(r=>r.source_id===id?r.target_id:r.source_id);let related=[];
   if(relatedIds.length){const {data,error}=await supabase.from("content").select("id,module,name").in("id",relatedIds).order("module").order("name");if(error)throw error;related=data||[]}
   renderDetail(data,orderData?.field_order,related);return;
  }
  const {data,error}=await supabase.from("content").select("id,module,name").eq("module",moduleName).order("created_at",{ascending:false});if(error)throw error;
  root.append(el("h1","content__title",moduleName));if(!data?.length){root.append(el("p","content__empty","No items found."));return}
  const list=el("div","content__list");data.forEach(item=>list.append(itemLink(item)));root.append(list);
 }catch(error){status.textContent=error.message||"Unable to load information."}
}
render();window.addEventListener("3b:global-update",()=>{root.replaceChildren();render()});
</script>
</head>
<body>
<main class="container content-page">
<div id="content-root"></div>
<p id="content-status" class="home__status" role="status" aria-live="polite"></p>
<a class="content__home" href="../home/">Home</a>
</main>
</body>
</html>
