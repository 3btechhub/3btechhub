<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account | 3B TECH HUB</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 18px 110px;display:grid;place-items:center;background:var(--color-bg);color:var(--color-text);font-family:var(--font-family)}#protected-content{visibility:hidden}.card{width:min(100%,440px);padding:32px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:20px;box-shadow:var(--shadow-card)}h1{margin:0 0 8px;font-size:28px}.subtitle{margin:0 0 28px;color:var(--color-muted)}.field{padding:15px 0;border-bottom:1px solid var(--color-border)}.field:last-of-type{border-bottom:0}.field-label{display:block;margin-bottom:6px;color:#6b7280;font-size:13px}.field-value{overflow-wrap:anywhere;font-weight:600}button{width:100%;margin-top:24px;padding:13px 18px;border:0;border-radius:10px;background:var(--color-primary);color:var(--color-primary-text);font:inherit;font-weight:600;cursor:pointer}#status{min-height:22px;margin-top:14px;color:var(--color-danger);font-size:14px}
</style></head><body data-page-title="Account"><div id="protected-content"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase/client.js"></script>
<script>
(async()=>{
 const supabase=window.supabaseClient;
 const loginUrl="../login/?target=account/";
 try{
  const {data:{session},error}=await supabase.auth.getSession();
  if(error||!session){window.location.replace(loginUrl);return;}
  const response=await fetch("https://sburxeuxkrilbfppxylm.supabase.co/functions/v1/protected-page?page=account",{
   method:"GET",headers:{apikey:"sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT",Authorization:"Bearer "+session.access_token}
  });
  if(!response.ok){await supabase.auth.signOut();window.location.replace(loginUrl);return;}
  const result=await response.json();
  if(typeof result.html!=="string"){window.location.replace(loginUrl);return;}
  document.getElementById("protected-content").innerHTML=result.html;
  document.getElementById("logout-button").addEventListener("click",async()=>{
   const button=document.getElementById("logout-button");button.disabled=true;
   const {error}=await supabase.auth.signOut();
   if(error){document.getElementById("status").textContent=error.message;button.disabled=false;return;}
   window.location.replace("../login/");
  });
  document.getElementById("protected-content").style.visibility="visible";
 }catch(e){window.location.replace(loginUrl);}
})();
</script></body></html>
