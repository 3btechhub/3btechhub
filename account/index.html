<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account | 3B TECH HUB</title><style>#protected-content{visibility:hidden}</style><script src="../loader.js"></script></head><body class="ui-auth-page"><div id="protected-content"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase/client.js"></script><script>
(() => {
 const supabase=window.supabaseClient,content=document.getElementById("protected-content"),loginUrl="../login/?target=account/";
 const showError=error=>{const card=document.createElement("section");card.className="ui-large-card ui-size-large ui-auth-section-card";const message=document.createElement("p");message.className="ui-status ui-status-error";message.setAttribute("role","alert");message.textContent=error?.message||"Account could not be loaded. Please try again.";card.appendChild(message);content.replaceChildren(card);content.style.visibility="visible";};
 const load=async()=>{try{const {data:{session},error:sessionError}=await supabase.auth.getSession();if(sessionError)throw sessionError;if(!session){window.location.replace(loginUrl);return;}
 const response=await fetch("https://sburxeuxkrilbfppxylm.supabase.co/functions/v1/protected-page?page=account",{method:"GET",headers:{apikey:"sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT",Authorization:"Bearer "+session.access_token},cache:"no-store"});
 if(response.status===401){window.location.replace(loginUrl);return;}if(response.status===403){window.location.replace("../");return;}const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||"Account could not be loaded ("+response.status+").");if(typeof result.html!=="string")throw new Error("The account response was invalid.");
 content.innerHTML=result.html;window.__3bAccess?.setPermissions(result.permissions);document.getElementById("logout-button").addEventListener("click",async event=>{const button=event.currentTarget;button.disabled=true;const {error}=await supabase.auth.signOut();if(error){document.getElementById("status").textContent=error.message;button.disabled=false;return;}window.location.replace("../login/");});content.style.visibility="visible";
 }catch(error){console.error("[3B TECH HUB] Account load failed:",error);showError(error);}};load();
})();
</script></body></html>
