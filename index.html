<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const path = location.hash || "#/home/overview";
        const type = path.includes("/home/list") ? "list" : path.includes("/home/detail") ? "detail" : path.includes("/account/profile") ? "profile" : path.includes("/account/login") ? "login" : path.includes("/dashboard") ? "dashboard" : "overview";
        document.documentElement.dataset.initialPage = type;
        document.documentElement.dataset.theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <style>
      #initial-skeleton{min-height:100vh;padding:16px;display:grid;align-content:start;gap:20px;background:#fff;color:#171717}
      [data-theme="dark"] #initial-skeleton{background:#111;color:#f4f4f4}
      .initial-bar{height:48px;border-radius:8px;background:#eee}
      [data-theme="dark"] .initial-bar{background:#242424}
      .initial-content{width:min(1120px,100%);margin:24px auto;display:grid;gap:16px}
      .initial-title{height:34px;width:38%;border-radius:8px;background:#eee}
      [data-theme="dark"] .initial-title{background:#242424}
      .initial-card{height:150px;border:1px solid #e5e5e5;border-radius:12px;background:linear-gradient(90deg,#f4f4f4 25%,#e9e9e9 50%,#f4f4f4 75%);background-size:200% 100%;animation:initial-shimmer 1.2s ease-in-out infinite}
      [data-theme="dark"] .initial-card{border-color:#333;background:linear-gradient(90deg,#1b1b1b 25%,#292929 50%,#1b1b1b 75%);background-size:200% 100%}
      @keyframes initial-shimmer{to{background-position:-200% 0}}
      [data-initial-page="list"] .initial-card{height:72px}
      [data-initial-page="detail"] .initial-card:first-of-type{height:36px;width:60%}
      [data-initial-page="login"] .initial-card,[data-initial-page="profile"] .initial-card{height:46px}
      [data-initial-page="dashboard"] .initial-card{height:130px}
      @media(prefers-reduced-motion:reduce){.initial-card{animation:none}}
    </style>
    <title>3B TECH HUB</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-skeleton" aria-label="Loading 3B TECH HUB">
        <div class="initial-bar"></div>
        <main class="initial-content">
          <div class="initial-title"></div>
          <div class="initial-card"></div>
          <div class="initial-card"></div>
          <div class="initial-card"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
