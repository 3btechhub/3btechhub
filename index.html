<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Root</title>
  <script>
    (() => {
      const read = (key, fallback) => {
        try { return localStorage.getItem(key) || fallback; }
        catch { return fallback; }
      };
      const selectedTheme = read("3btechhub-theme", "classic");
      const validTheme = /^[a-z0-9-]+$/.test(selectedTheme) ? selectedTheme : "classic";
      const selectedMode = read("3btechhub-color-mode", "system");
      const validMode = ["system", "light", "dark"].includes(selectedMode) ? selectedMode : "system";
      const resolvedMode = validMode === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : validMode;
      document.documentElement.dataset.colorMode = resolvedMode;
      const base = "themes/" + encodeURIComponent(validTheme) + "/";
      document.write(
        '<link rel="stylesheet" data-theme-controller="standard" href="' + base + 'standard.css">' +
        '<link rel="stylesheet" data-theme-controller="mode" href="' + base + resolvedMode + '.css">' +
        '<link rel="stylesheet" data-theme-controller="navigation" href="' + base + 'navigation.css">' +
        '<link rel="stylesheet" data-theme-controller="medium-input-box" href="' + base + 'medium-input-box.css">' +
        '<link rel="stylesheet" data-theme-controller="medium-input-button" href="' + base + 'medium-input-button.css">'
      );
    })();
  </script>
  <script src="components/theme-controller.js"></script>
  <script src="components/navigation.js" defer></script>
</head>
<body>
</body>
</html>
