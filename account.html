<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account | 3B TECH HUB</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px 110px; display: grid; place-items: center; background: #f3f4f6; color: #111827; font-family: system-ui, sans-serif; }
    .card { width: min(100%, 440px); padding: 32px; background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; box-shadow: 0 12px 36px rgb(17 24 39 / 8%); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 28px; color: #6b7280; }
    .field { padding: 15px 0; border-bottom: 1px solid #e5e7eb; }
    .field:last-of-type { border-bottom: 0; }
    .field-label { display: block; margin-bottom: 6px; color: #6b7280; font-size: 13px; }
    .field-value { overflow-wrap: anywhere; font-weight: 600; }
    button { width: 100%; margin-top: 24px; padding: 13px 18px; border: 0; border-radius: 10px; background: #111827; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 22px; margin-top: 14px; color: #b91c1c; font-size: 14px; }
    #account-card { display: none; }
    #checking { color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <p id="checking" role="status">Checking login...</p>

  <main class="card" id="account-card">
    <h1>My Account</h1>
    <p class="subtitle">Your 3B TECH HUB account information</p>
    <div class="field"><span class="field-label">Name</span><div class="field-value" id="user-name"></div></div>
    <div class="field"><span class="field-label">Email</span><div class="field-value" id="user-email"></div></div>
    <div class="field"><span class="field-label">Role</span><div class="field-value" id="user-role"></div></div>
    <button id="logout-button" type="button">Logout</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      "https://sburxeuxkrilbfppxylm.supabase.co",
      "sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT"
    );

    const checking = document.getElementById("checking");
    const accountCard = document.getElementById("account-card");

    async function loadAccount() {
      try {
        // First restore the saved browser session. If there is no session,
        // do not render account information and send the visitor to login.
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();

        if (sessionError || !sessionData.session) {
          window.location.replace("./login.html");
          return;
        }

        // Validate the session with Supabase before showing protected content.
        const { data: userData, error: userError } = await supabase.auth.getUser();

        if (userError || !userData.user) {
          await supabase.auth.signOut();
          window.location.replace("./login.html");
          return;
        }

        const user = userData.user;
        const metadata = user.user_metadata || {};
        const appMetadata = user.app_metadata || {};

        document.getElementById("user-name").textContent =
          metadata.full_name || metadata.name ||
          [metadata.first_name, metadata.last_name].filter(Boolean).join(" ") ||
          user.email?.split("@")[0] || "Not provided";
        document.getElementById("user-email").textContent = user.email || "Not provided";
        document.getElementById("user-role").textContent = appMetadata.role || "Not assigned";

        checking.style.display = "none";
        accountCard.style.display = "block";
      } catch (error) {
        window.location.replace("./login.html");
      }
    }

    document.getElementById("logout-button").addEventListener("click", async () => {
      const button = document.getElementById("logout-button");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "";

      const { error } = await supabase.auth.signOut();
      if (error) {
        status.textContent = error.message;
        button.disabled = false;
        return;
      }
      window.location.replace("./login.html");
    });

    loadAccount();
  </script>
  <script src="./navigation.js"></script>
</body>
</html>
