<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard | 3B TECH HUB</title>
<style>#protected-content{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase/client.js"></script><script src="../loader.js"></script></head><body class="ui-dashboard-page"><div id="protected-content"></div>
<script>
(async()=>{
 const supabase=window.supabaseClient;
 const loginUrl="../login/?target=dashboard/";
 try{
  const {data:{session},error}=await supabase.auth.getSession();
  if(error||!session){window.location.replace(loginUrl);return;}
  const response=await fetch("https://sburxeuxkrilbfppxylm.supabase.co/functions/v1/protected-page?page=dashboard",{
   method:"GET",headers:{apikey:"sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT",Authorization:"Bearer "+session.access_token},cache:"no-store"
  });
  if(response.status===401){window.location.replace(loginUrl);return;}
  if(response.status===403){window.location.replace("../");return;}
  if(!response.ok)throw new Error("Dashboard could not be loaded.");
  const result=await response.json();
  if(typeof result.html!=="string"){window.location.replace("../");return;}
  const content=document.getElementById("protected-content");
  content.innerHTML=result.html;
  window.__3bAccess?.setPermissions(result.permissions);
  const root=content.querySelector("#dashboard-content");
  if(root) document.dispatchEvent(new CustomEvent("3b-context-request",{detail:{name:"dashboard",root}}));
  content.style.visibility="visible";
 }catch(e){window.location.replace(loginUrl);}
})();
</script></body></html>
