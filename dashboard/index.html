<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard | 3B TECH HUB</title>
<style>html,body{visibility:hidden}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4f6;color:#111827;font-family:system-ui,sans-serif}</style></head><body data-page-title="Dashboard"><div id="protected-content"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase/client.js"></script>
<script>
(async()=>{
 const supabase=window.supabaseClient;
 const loginUrl="../login/?target=dashboard/";
 try{
  const {data:{session},error}=await supabase.auth.getSession();
  if(error||!session){window.location.replace(loginUrl);return;}
  const response=await fetch("https://sburxeuxkrilbfppxylm.supabase.co/functions/v1/protected-page?page=dashboard",{
   method:"GET",headers:{apikey:"sb_publishable_lqGGahZ0ST267jqsI3Zelg_477szacT",Authorization:"Bearer "+session.access_token}
  });
  if(!response.ok){await supabase.auth.signOut();window.location.replace(loginUrl);return;}
  const result=await response.json();
  if(typeof result.html!=="string"){window.location.replace(loginUrl);return;}
  document.getElementById("protected-content").innerHTML=result.html;
  document.documentElement.style.visibility="visible";document.body.style.visibility="visible";
 }catch(e){window.location.replace(loginUrl);}
})();
</script><script src="../page-title.js"></script></body></html>
