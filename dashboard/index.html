<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard | 3B TECH HUB</title>
<style>html,body{visibility:hidden}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4f6;color:#111827;font-family:system-ui,sans-serif}#dashboard-content{display:none}</style></head><body>
<main id="dashboard-content"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase/client.js"></script><script>
const supabase=window.supabaseClient;
const loginUrl="../login/?target=dashboard/";
let redirectTimer;
function redirectToLogin(){window.location.replace(loginUrl);}
async function protectDashboard(){
 redirectTimer=setTimeout(redirectToLogin,8000);
 try{
  if(!supabase?.auth){redirectToLogin();return;}
  const {data:userData,error:userError}=await supabase.auth.getUser();
  if(userError||!userData?.user){redirectToLogin();return;}
  clearTimeout(redirectTimer);
  document.getElementById("dashboard-content").style.display="block";
  document.documentElement.style.visibility="visible";
  document.body.style.visibility="visible";
 }catch(error){redirectToLogin();}
}
protectDashboard();
</script><script src="../navigation.js"></script></body></html>
