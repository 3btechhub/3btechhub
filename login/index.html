<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <script src="../components/theme-controller.js"></script>
  <script type="module" src="../components/supabase-client.js"></script>
  <script src="../components/navigation.js" defer></script>
</head>
<body>
  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <form style="display:flex;flex-direction:column;align-items:center;text-align:center">
      <input
        class="medium-input-box"
        style="text-align:center"
        type="email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        required
      >
      <input
        class="medium-input-box"
        style="text-align:center"
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >
      <button class="medium-input-button" type="submit">Login</button>
    </form>
  </main>
</body>
</html>
