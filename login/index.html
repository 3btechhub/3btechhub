<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | 3B TECH HUB</title>
<script src="../loader.js"></script></head><body class="ui-auth-page">
<main class="ui-large-card ui-auth-section-card" id="login-card"><form id="login-form" class="ui-form"><div class="ui-form-field"><label class="ui-form-label" for="email">Email</label><input class="ui-input" id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required></div><div class="ui-form-field"><label class="ui-form-label" for="password">Password</label><input class="ui-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div><button class="ui-button ui-button-primary ui-button-block" id="login-button" type="submit">Login</button><p class="ui-form-status" id="status" role="status" aria-live="polite"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase/client.js"></script>
<script type="module">
const form=document.getElementById("login-form"),button=document.getElementById("login-button"),status=document.getElementById("status");
const allowedTargets=new Set(["account/","dashboard/"]);
const requestedTarget=new URLSearchParams(window.location.search).get("target");
const targetPage=allowedTargets.has(requestedTarget)?requestedTarget:"account/";
const targetUrl="../"+targetPage;
const supabase=window.supabaseClient;
try{
 const {data,error}=await supabase.auth.getSession();
 if(error)throw error;
 if(data.session){window.location.replace(targetUrl);}
}catch(error){status.textContent=error.message||"Could not connect to Supabase.";}
form.addEventListener("submit",async event=>{
 event.preventDefault();
 status.textContent="";
 button.disabled=true;
 button.textContent="Logging in...";
 try{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(data.user){window.location.replace(targetUrl);return;}
  throw new Error("Login could not be verified. Please try again.");
 }catch(error){
  status.textContent=error.message||"Login failed. Please try again.";
  button.disabled=false;
  button.textContent="Login";
 }
});
</script></body></html>
