<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <script src="../components/theme-controller.js"></script>
  <link rel="stylesheet" href="../themes/classic/standard.css">
  <link rel="stylesheet" href="../themes/classic/light.css">
  <link rel="stylesheet" href="../themes/classic/dark.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="login-page">
    <form>
      <input type="email" name="email" placeholder="Email" autocomplete="email" required>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
  </main>
  <script src="../components/navigation.js"></script>
</body>
</html>
