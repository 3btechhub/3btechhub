name: Deploy static site to GitHub Pages

run-name: Deploy 3B TECH HUB from ${{ github.ref_name }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare all HTML pages with the central loader
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")
          loader = '<script src="/3btechhub/loader.js"></script>'

          for html in root.rglob("*.html"):
              content = html.read_text(encoding="utf-8")
              content = re.sub(
                  r'<script\b[^>]*src=["\'][^"\']*(?:loader|navigation|page-title)\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',
                  "",
                  content,
                  flags=re.IGNORECASE,
              )
              if re.search(r"</body\s*>", content, flags=re.IGNORECASE):
                  content = re.sub(
                      r"</body\s*>",
                      loader + "\n</body>",
                      content,
                      count=1,
                      flags=re.IGNORECASE,
                  )
              else:
                  content += "\n" + loader + "\n"
              html.write_text(content, encoding="utf-8")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
