name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate website JavaScript
        run: |
          python3 - <<'PY'
          import re
          source = open("site/index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script type="module">(.*?)</script>', source, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one module script, found {len(scripts)}")
          with open("/tmp/website.mjs", "w", encoding="utf-8") as output:
              output.write(scripts[0])
          PY
          node --check /tmp/website.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the current main branch website from the site directory.
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
